<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>指輪物語 旅の仲間</title>
<style>
  html, body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#111;}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #eee; position:sticky; top:0; z-index:400; background:#fff;}
  h1{margin:0;font-size:18px;}
  .small{font-size:12px;opacity:.75;}
  .join-box{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px; position:relative; z-index:2;}
  .join-box input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:16px;}
  .btn{padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:#f8f8f8;cursor:pointer;}
  .btn.primary{background:#111;color:#fff;border-color:#111;}
  .btn.ghost{background:transparent;}
  .hidden{display:none;}
  #lobby{padding:20px;border-top:1px solid #eee; position:relative; z-index:2;}
  .copy-btn.copied, .btn.ghost.copied{background:#16a34a;color:#fff;border-color:#16a34a;}

  /* ★ main背景：入室前/入室後で切替 */
  main{
    position:relative;
    height:calc(100vh - 60px);
    overflow:hidden;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  main.prejoin{ background-image:url('tabinonakamaback.jpg'); }
  main.joined{ background-image:url('tabibitomain.jpg'); }

  /* ★ 着席ポップ */
  .seat-pop{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    background:orange;border:1px solid #eee;border-radius:12px;
    box-shadow:0 12px 28px rgba(0,0,0,.12);
    padding:10px;z-index:330;display:flex;flex-direction:column;gap:10px;min-width:280px;
  }
  .seat-pop.hidden{display:none;}
  .seat-pop .row{display:flex;gap:8px;align-items:center;}
  .seat-pop label{width:84px;font-size:13px;}
  .seat-pop .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:6px 10px;border:1px solid #ddd;border-radius:999px;cursor:pointer;user-select:none;position:relative;}
  .tab.disabled{opacity:.45; pointer-events:none;}
  .tab.disabled::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700;color:#b91c1c;pointer-events:none;}
  .tab.active{background:#111;color:#fff;border-color:#111;}

  /* ★ ホスト人数選択中：参加者に出す黒ポップ（下固定） */
  .host-selecting-pop{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    background:rgba(20,20,20,.92);color:#fff;
    padding:12px 16px;border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
    z-index:330;font-weight:800;white-space:nowrap;
    pointer-events:none;
  }
  .host-selecting-pop.hidden{display:none;}

  /* ★ プレイヤー円配置用 */
  .player-circle{
    position:relative;width:min(76vw,420px);height:min(76vw,420px);
    margin:8px auto 0;border-radius:50%;
    box-sizing:border-box;border:none;z-index:5;
  }
  .player-circle::before{content:'';}
  .player-tag{
    position:absolute;transform:translate(-50%,-50%);
    padding:4px 8px;border-radius:999px;background:#f8f8f8;
    border:1px solid #ddd;font-size:12px;white-space:nowrap;
  }
  .player-tag.me{ background:#111;color:#fff;border-color:#111; }
  .player-tag.me{margin-top:64px;}
  /* transform でできる stacking context ごと場札より手前に出し、受取カード全体を操作可能にする。 */
  .player-tag.exchange-return-active{z-index:5;}

  /* 他プレイヤーのミニカード（ネームタグの下に扇状） */
  .player-tag .mini-hand{
    position:absolute;left:50%;top:100%;
    transform:translate(-50%,3px);
    width:100px;height:56px;pointer-events:none;
  }
  .player-tag .mini-card{
    position:absolute;left:50%;top:0;width:32px;height:44px;
    border-radius:6px;border:1px solid #10233f;
    background:#fff url('tabicardura.jpg') center/cover no-repeat;
    font-size:10px;display:flex;align-items:center;justify-content:center;
    transform-origin:bottom center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .player-tag.current-turn .mini-hand{animation:turnHandPulse 1.05s ease-in-out infinite;transform-origin:center top;}
  @keyframes turnHandPulse{50%{transform:translate(-50%,3px) scale(1.1)}}

  /* 自分の手札表示（大きめ横並び） */
  .my-hand-wrapper{position:relative;z-index:6;margin-top:17px;text-align:center;}
  .my-hand-title{display:none;}
  /* 手札が1段になっても中央寄せされるゲーム盤全体の高さを変えず、プレイヤーサークルを固定する。 */
  .my-hand{--hand-card-scale:1;display:flex;width:min(calc(100vw - 8px),calc(var(--hand-columns,1) * 82px + (var(--hand-columns,1) - 1) * 10px + 24px));height:254px;box-sizing:border-box;flex-direction:column;align-items:center;gap:10px;margin:6px auto 0;padding:0 12px;}
  .hand-row{display:flex;justify-content:center;gap:10px;min-height:122px;transform:scale(var(--hand-card-scale));transform-origin:top center;}
  /* 行全体を一度だけ拡縮し、キャラカード内の欄・文字・余白も原版と完全に同じ比率に保つ。 */
  .hand-row>.my-card{flex:0 0 82px;}
  .hand-row-upper{position:relative;top:46px;z-index:3;}
  .hand-row-lower{position:relative;top:var(--lower-row-offset,38px);z-index:2;}
  .hand-row:empty{display:none;}
  /* 実際の占有幅を詰めるため、下段の末尾にも余分な空白が残らない。 */
  .my-hand.overlapping-cards .hand-row>.my-card:not(.character-card)+.my-card:not(.character-card){margin-left:-13px;z-index:calc(2 + var(--card-stack-index,0));}
  .my-hand.overlapping-cards .hand-row>.character-card-unit+.my-card,.my-hand.overlapping-cards .hand-row>.character-card-slot+.my-card{margin-left:8px;}
  .my-card{
    --card-color:#9ca3af;--detail-color:var(--card-color);--panel-fill:#fffdf3;
    position:relative;width:82px;height:122px;border-radius:10px;
    border:4px solid var(--card-color);background-color:#fff;background-position:center;background-size:cover;
    box-sizing:border-box;overflow:hidden;color:#27231f;
    box-shadow:0 4px 12px rgba(0,0,0,.18),inset 0 0 0 2px rgba(0,0,0,.62);
  }
  @property --playable-card-scale{syntax:'<number>';inherits:true;initial-value:1;}
  .my-hand.has-playable-cards{animation:playableCardsPulse 1.05s ease-in-out infinite;}
  .my-card.playable{cursor:grab;touch-action:none;transform:scale(var(--playable-card-scale));}
  .my-card.drag-source{visibility:hidden;}
  @keyframes playableCardsPulse{50%{--playable-card-scale:1.07}}
  .drag-card{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) scale(var(--drag-card-scale,1));opacity:.94;transform-origin:center;}
  .play-circle{position:absolute;width:64px;height:88px;border:0;border-radius:14px;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:6;}
  .play-circle.drop-hint::before{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(125,211,252,.22);opacity:0;transition:opacity .15s;}
  .player-circle.dragging .play-circle.drop-hint::before{opacity:1;}
  .played-card-slot{position:relative;width:54px;height:81px;transform:rotate(var(--tilt));animation:cardArrive .35s ease-out both;}
  .played-card{position:absolute;left:0;top:0;transform:scale(.66);transform-origin:top left;}
  .played-card-slot.no-arrive{animation:none;}
  .played-card-slot.self-play{animation-name:cardArriveSelf;}
  @keyframes cardArrive{from{opacity:0;transform:translate(var(--from-x,0),var(--from-y,0)) scale(.25) rotate(var(--tilt))}to{opacity:1;transform:translate(0,0) scale(1) rotate(var(--tilt))}}
  @keyframes cardArriveSelf{from{opacity:.88;transform:translate(var(--from-x,0),var(--from-y,0)) scale(var(--self-play-scale,1.5)) rotate(var(--tilt))}to{opacity:1;transform:translate(0,0) scale(1) rotate(var(--tilt))}}
  .played-card-slot.gathering{animation:gatherCard .7s ease-in-out both;}
  .played-card-slot.gathered{animation:none;transform:translate(var(--gather-x),var(--gather-y)) rotate(var(--tilt));}
  @keyframes gatherCard{from{transform:translate(0,0) rotate(var(--tilt))}to{transform:translate(var(--gather-x),var(--gather-y)) rotate(var(--tilt))}}
  .capture-circle{position:absolute;width:38px;height:56px;transform:translate(-50%,-50%);z-index:6;}
  .capture-trick{position:absolute;top:0;width:38px;height:56px;}
  .capture-card{position:absolute;inset:0;width:38px;height:56px;transform:rotate(var(--stack-rotate,-2deg));transform-origin:center;}
  .capture-card .my-card{transform:scale(.46);transform-origin:top left;}
  /* 脅威カードは、画像を見せながら左端の黒い矢印欄だけに情報を置く。 */
  .threat-card{--card-color:#4a2f20;--detail-color:#050505;background:#302f2c url('kyoi.jpg') center/cover no-repeat;}
  .threat-card::after{content:'';position:absolute;inset:2px;border:1px solid rgba(255,244,220,.72);border-radius:6px;pointer-events:none;}
  .threat-card .card-badge{top:5px;left:0;width:31px;height:23px;padding-right:6px;box-sizing:border-box;background:#4a2f20;clip-path:polygon(0 0,72% 0,100% 50%,72% 100%,0 100%);display:grid;place-items:center;text-align:center;}
  .threat-card .card-badge::before{display:block;inset:1px;background:#050505;clip-path:polygon(0 0,72% 0,100% 50%,72% 100%,0 100%);}
  .threat-card .card-badge.right{display:none;}
  .threat-card .card-number{padding:0;color:#fff;font-size:16px;line-height:23px;}
  .threat-card .card-mark{display:none;}
  .threat-card .card-name{left:0;right:auto;bottom:5px;width:66px;height:19px;padding-right:9px;box-sizing:border-box;background:#4a2f20;color:#fff;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);font-size:9px;line-height:19px;letter-spacing:0;white-space:nowrap;}
  .threat-card .card-name::before{display:block;inset:1px;background:#050505;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);}
  .threat-card .card-name-initial{color:inherit;-webkit-text-stroke:0;}
  .capture-card.new-capture{animation:captureArrive .7s ease-in both;}
  .victory-condition-icon{width:auto;min-width:15px;height:15px;border:0;background:transparent;color:#111;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:1px;font:700 10px/15px system-ui,-apple-system,"Segoe UI",sans-serif;pointer-events:none;white-space:nowrap;}
  .victory-condition-squares,.victory-condition-option{display:flex;align-items:center;justify-content:center;gap:1px;}
  .victory-condition-square{width:15px;height:15px;border:0;border-radius:2px;background:#111;color:#fff;box-sizing:border-box;display:grid;place-items:center;font:700 10px/15px system-ui,-apple-system,"Segoe UI",sans-serif;}
  .victory-condition-icon.ring .victory-condition-square{background:#f2c94c;color:#111;}
  .victory-condition-icon.hill .victory-condition-square{background:#d98236;color:#111;}
  .victory-condition-icon.choice{gap:0;}
  .victory-condition-or{margin:0 1px;font-size:9px;font-weight:900;line-height:15px;}
  .victory-condition-suffix{margin-left:2px;font-size:9px;font-weight:900;line-height:15px;}
  .victory-condition-icon.achieved{opacity:.35;}
  .victory-condition-icon.awaiting-threat{display:none;}
  .victory-condition-icon.word .victory-condition-square{width:24px;}
  .victory-condition-icon.multiline{height:auto;flex-direction:column;gap:1px;line-height:12px;}
  .victory-condition-line{display:flex;align-items:center;justify-content:center;gap:2px;height:15px;}
  .victory-condition-label{font-size:10px;font-weight:900;line-height:12px;white-space:nowrap;}
  .victory-condition-side-label{height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:12px;}
  .victory-condition-square.white{
    border:1px solid #142b4a;background-color:#edf2f7;color:#142b4a;font-size:14px;font-weight:900;line-height:15px;text-align:center;
    background-image:repeating-linear-gradient(135deg,transparent 0,transparent 3px,rgba(20,43,74,.28) 3px,rgba(20,43,74,.28) 4px);
  }
  .victory-condition-square.black{
    border:1px solid #142b4a;background-color:#edf2f7;color:#142b4a;box-shadow:none;
    background-image:repeating-linear-gradient(135deg,transparent 0,transparent 3px,rgba(20,43,74,.28) 3px,rgba(20,43,74,.28) 4px);
  }
  .victory-condition-arrow{display:block;width:17px;height:17px;color:#111;}
  .victory-condition-arrow svg{display:block;width:100%;height:100%;fill:currentColor;}
  .victory-condition-square.green{background:#559344;color:#111;}
  .victory-condition-square.orange{background:#d98236;color:#111;}
  .victory-condition-square.yellow{background:#f2c94c;color:#111;}
  .victory-condition-square.red{background:#c94c47;color:#fff;}
  .victory-condition-square.gray{background:#a9aca8;color:#111;}
  .victory-condition-square.wide{width:24px;font-size:8px;}
  .victory-condition-trick{position:relative;width:23px;height:20px;display:inline-block;}
  .victory-condition-trick .victory-condition-square{position:absolute;left:0;top:5px;z-index:3;}
  .victory-condition-trick::before,.victory-condition-trick::after{
    content:'';position:absolute;width:15px;height:15px;box-sizing:border-box;border:1px solid #142b4a;border-radius:2px;background-color:#edf2f7;
    background-image:repeating-linear-gradient(135deg,transparent 0,transparent 3px,rgba(20,43,74,.28) 3px,rgba(20,43,74,.28) 4px);
  }
  .victory-condition-trick::before{left:4px;top:3px;z-index:2;}
  .victory-condition-trick::after{left:8px;top:1px;z-index:1;}
  .victory-condition-fail{position:relative;margin-right:-5px;top:-1px;z-index:4;color:#c94c47;font-size:12px;line-height:15px;}
  .character-card-unit{position:relative;flex:0 0 82px;width:82px;height:122px;}
  .character-card-unit>.character-card{width:82px;height:122px;}
  .character-card-unit>.victory-condition-icon{position:absolute;left:50%;top:var(--victory-icon-top,127px);z-index:4;transform:translateX(-50%) scale(var(--victory-icon-scale,1));}
  .character-capture>.victory-condition-icon{position:absolute;left:50%;top:61px;z-index:2;transform:translateX(-50%);}
  @keyframes captureArrive{from{transform:translate(var(--capture-x),var(--capture-y)) scale(1.6) rotate(var(--stack-rotate,0deg))}to{transform:translate(0,0) rotate(var(--stack-rotate,0deg))}}
  .game-status{text-align:center;min-height:22px;font-size:13px;font-weight:800;color:#075985;margin-top:2px;}
  .stage-dialog{position:fixed;inset:0;z-index:320;display:grid;place-items:center;background:rgba(0,0,0,.38);}
  .stage-dialog.hidden{display:none;}
  .stage-panel{box-sizing:border-box;width:max-content;max-width:calc(100vw - 32px);padding:8px;border-radius:14px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;}
  .stage-grid{display:grid;grid-template-columns:repeat(4,36px);justify-content:center;gap:10px;}
  .stage-tab{width:36px;height:36px;padding:0;border:1px solid #111;border-radius:50%;background:#fff;font-size:12px;font-weight:800;cursor:pointer;}
  .stage-tab:hover,.stage-tab:focus-visible{background:#111;color:#fff;}
  .center-lower-card-area.hidden{display:none;}
  .center-lower-card-area{
    position:fixed;left:16px;top:calc(68% - 101px);transform:translateY(-80px);
    width:calc(100vw - 32px);display:flex;align-items:center;justify-content:space-between;
    z-index:4;pointer-events:none;
  }
  /* キャラクター候補とは別の固定レイヤーで、選択中だけ場札一式を画面上部にまとめる。 */
  .center-lower-card-area.character-selection-layout{
    left:calc(50% - 144px);top:70px;width:288px;transform:translateY(0);
  }
  .center-lower-card-area.event-stage-layout.character-selection-layout{left:50%;width:475px;flex-direction:row;justify-content:center;gap:0;transform:translateX(-50%);scale:min(1,calc((100vw - 8px)/475));transform-origin:top center;}
  .event-stage-layout.character-selection-layout>.center-card-row{display:contents;}
  .event-stage-layout.character-selection-layout #arasujisquare{order:1;margin-left:0;}
  .event-stage-layout.character-selection-layout #winningconditionsquare{order:2;}
  .event-stage-layout.character-selection-layout .event-card-row>.event-card:nth-child(2){order:3;}
  .event-stage-layout.character-selection-layout .event-card-row>.event-card:nth-child(1){order:4;}
  .event-stage-layout.character-selection-layout>.center-lower-card,.event-stage-layout.character-selection-layout>.center-card-row>.center-lower-card{margin-left:-7px;}
  .center-card-row{width:100%;display:flex;align-items:center;justify-content:space-between;}
  .event-card-row{display:none;}
  .event-stage-layout.character-selection-layout .event-card-row{display:contents;}
  .event-stage-layout:not(.character-selection-layout) .event-card-row{
    position:absolute;right:-8px;top:-48px;width:68px;height:100px;display:block;
    z-index:5;pointer-events:auto;cursor:pointer;transform:rotate(3deg);transform-origin:center;
  }
  .event-stage-layout:not(.character-selection-layout) .event-card-row .event-card{
    position:absolute;right:0;top:0;transform:scale(.6);transform-origin:top right;
    box-shadow:0 5px 14px rgba(0,0,0,.28);
  }
  /* ミニ表示にはルール面ではなく、2枚目のあらすじイベント面を使う。 */
  .event-stage-layout:not(.character-selection-layout) .event-card-row .event-card:first-child{display:none;}
  /* 第五章の古森デッキは、小イベントカードの左に獲得札と同じ大きさで置く。 */
  .old-forest-area{display:none;}
  .event-stage-layout:not(.character-selection-layout) .old-forest-area{
    position:absolute;right:72px;top:22px;width:80px;height:56px;display:block;pointer-events:none;
  }
  .old-forest-deck,.old-forest-reveal{position:absolute;top:0;width:38px;height:56px;}
  .old-forest-deck{right:0;border:1px solid #10233f;border-radius:6px;background:#fff url('tabicardura.jpg') center/cover no-repeat;box-sizing:border-box;box-shadow:-2px 2px 0 #fff,-3px 3px 0 #10233f,-5px 5px 0 #fff,-6px 6px 0 #10233f;}
  .old-forest-deck.empty{visibility:hidden;}
  .old-forest-reveal{left:0;transform:rotate(-2deg);transform-origin:center;}
  .old-forest-reveal>.my-card{transform:scale(.46);transform-origin:top left;}
  .event-card-modal-backdrop{position:fixed;inset:0;z-index:490;display:grid;place-items:center;background:rgba(0,0,0,.18);cursor:pointer;}
  .event-card-modal-backdrop.hidden{display:none;}
  .event-card-modal-row{display:flex;align-items:flex-start;gap:14px;height:160px;cursor:default;transform:translateY(33.6px);}
  .event-card-modal-row .event-card{flex:0 0 112px;width:112px;height:160px;box-shadow:0 16px 38px rgba(0,0,0,.45);}
  .event-stage-layout:not(.character-selection-layout) #winningconditionsquare{cursor:pointer;}
  .center-lower-card{
    position:relative;box-sizing:border-box;border:0;border-radius:10px;overflow:hidden;
    background-color:transparent;background-position:center;background-size:cover;background-repeat:no-repeat;flex:0 0 auto;
  }
  #arasujisquare{width:112px;height:160px;background-image:url('arasujisquare.jpg');}
  #winningconditionsquare{width:160px;height:112px;overflow:visible;background-image:url('winningconditionsquare.jpg');}
  .event-card{width:112px;height:160px;background-image:url('eventback.jpg');}
  .event-card-title{position:absolute;left:13%;right:13%;top:calc(8% - 6px);height:16%;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:900;line-height:1.05;}
  .event-card-text{position:absolute;left:50%;top:58%;width:95px;height:112px;transform:translate(-50%,-50%) translateY(-2px);display:block;padding:2px;box-sizing:border-box;overflow:hidden;white-space:pre-line;text-align:left;font-size:10px;line-height:1.08;}
  .event-card-text strong{display:block;margin-bottom:2px;font-weight:900;}
  .event-card-gap{display:block;height:3px;}
  .event-card-hammer{display:inline-block;width:8px;height:8px;margin-right:2px;vertical-align:-1px;color:#111;}
  .event-card-hammer svg{display:block;width:100%;height:100%;fill:currentColor;}
  .ringcircle{position:absolute;left:+80px;top:120px;width:56px;height:56px;box-sizing:border-box;border:1px solid #111;border-radius:50%;background:url('ringcircleoff.jpg') center/cover no-repeat;transform:translateY(-50%);z-index:2;}
  .ringcircle.on{background-image:url('ringcircleon.jpg');}
  .excluded-card-slot{position:absolute;left:20px;top:93px;width:38px;height:56px;transform:rotate(var(--excluded-tilt,0deg));transform-origin:center;z-index:2;}
  .excluded-card-slot .my-card{transform:scale(.46);transform-origin:top left;}
  .excluded-card-slot.hidden{display:none;}
  .excluded-card-slot.gandalf-pick{pointer-events:auto;cursor:pointer;animation:excludedCardPulse 1.05s ease-in-out infinite;}
  @keyframes excludedCardPulse{50%{transform:rotate(var(--excluded-tilt,0deg)) scale(1.12)}}
  .lost-card-flight{position:fixed;z-index:1001;pointer-events:none;width:82px;height:122px;transform-origin:top left;}

// 長い特殊カード名を、カード幅に合わせて一行に収める。
const cardNameFitObserver = new ResizeObserver(entries => {
  entries.forEach(({ target }) => {
    target.style.fontSize = '9px';
    const styles = getComputedStyle(target);
    const horizontalPadding = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
    const availableWidth = target.clientWidth - horizontalPadding;
    const range = document.createRange();
    range.selectNodeContents(target);
    const textWidth = range.getBoundingClientRect().width;
    if (!availableWidth || textWidth <= availableWidth) return;
    const fittedSize = Math.max(4, 9 * availableWidth / textWidth);
    target.style.fontSize = `${fittedSize}px`;
  });
});

const characterNameMeasureContext = document.createElement('canvas').getContext('2d');
const characterNameLayouts = new Map();

// 表示先のtransform倍率に影響されない基準寸法で、すべてのキャラクター名を調整する。
function fitCharacterName(target){
  const name = target.textContent || '';
  let layout = characterNameLayouts.get(name);
  if (!layout) {
    const baseSize = 9;
    const padding = 20.5;
    const maximumWidth = 78;
    characterNameMeasureContext.font = `900 ${baseSize}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
    const baseTextWidth = characterNameMeasureContext.measureText(name).width;
    const width = Math.min(Math.ceil(baseTextWidth + padding), maximumWidth);
    const availableWidth = width - padding;
    const fontSize = baseTextWidth > availableWidth
      ? Math.max(1, Math.floor((baseSize * availableWidth / baseTextWidth) * 100) / 100)
      : baseSize;
    layout = { width, fontSize };
    characterNameLayouts.set(name, layout);
  }
  // 選択中・自分・他プレイヤーの各カードへ、同じ基準値をそのまま適用する。
  target.style.width = `${layout.width}px`;
  target.style.fontSize = `${layout.fontSize}px`;
}

function positionZoomCards(){
  const scale = Number(cardZoomFrame.style.getPropertyValue('--zoom-scale')) || 1;

  const baseHeight = Number(cardZoomFrame.style.getPropertyValue('--zoom-base-height').replace('px', '')) || 122;
  const halfWidth = baseWidth * scale / 2;
  const halfHeight = baseHeight * scale / 2;
  cardZoomFrame.querySelectorAll('.card-zoom-item').forEach(item => {
    const playerId = item.dataset.playerId;
    const hand = playerId === state.userId
      ? myHandEl
      : playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(playerId)}"] .mini-hand`);
    const fallback = playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(playerId)}"]`);
    const rect = (hand || fallback)?.getBoundingClientRect();
    if (!rect) return;
    const x = Math.min(window.innerWidth - halfWidth - 8, Math.max(halfWidth + 8, rect.left + rect.width / 2));
    const y = Math.min(window.innerHeight - halfHeight - 8, Math.max(halfHeight + 8, rect.top + rect.height / 2));
    item.style.left = `${x}px`;
    item.style.top = `${y}px`;
  });
}

function hasAchievedVictoryCondition(cardData, playerId){
  return victoryConditionStatus(state.room, playerId, cardData).status === 'achieved';
}

function victoryConditionStatus(room, playerId, suppliedCharacter){
  const game = room?.game;
  const character = suppliedCharacter || (room?.hands?.[playerId]?.cards || [])
    .find(card => card?.kind === 'character') || game?.characterSelections?.[playerId];
  if (!game || !character) return { status:'pending' };
  const capturedTricks = game.capturedTricks?.[playerId] || [];
  const trickCount = capturedTricks.length;
  const playerIds = game.playerOrder || [];
  const otherIds = playerIds.filter(id => id !== playerId);
  const remainingRounds = Math.max(0, ...playerIds.map(id => (room.hands?.[id]?.cards || [])
    .filter(card => card?.kind !== 'character').length));
  const victory = character.victory || characterCardData(character, playerId).victory;
  const isFinished = game.finished === true;

  if (victory.includes('脅威カードと同じランク') || (character.name === 'サム' && victory.includes('脅威カードと同じ数字'))) {
    const threatRanks = new Set((game.threatCards?.[playerId] || []).map(card => Number(card.number)));
    const hasMatchingHill = capturedTricks.some(trick => (trick.cards || [])
      .some(card => card.color === 'orange' && threatRanks.has(Number(card.number))));
    if (hasMatchingHill) return { status:'achieved' };
    const matchingHillRemains = Object.values(room.hands || {}).some(hand => (hand?.cards || [])
      .some(card => card.color === 'orange' && threatRanks.has(Number(card.number))));
    return { status:(!isFinished && matchingHillRemains) ? 'pending' : 'failed' };
  }

  if (victory.includes('指輪')) {
    const target = Number(victory.match(/\d+/)?.[0] || 1);
    const count = capturedTricks.reduce((total, trick) => total
      + (trick.cards || []).filter(card => card.color === 'yellow').length, 0);
    if (count >= target) return { status:'achieved' };
    const remainingRings = Object.values(room.hands || {}).reduce((total, hand) => total
      + (hand?.cards || []).filter(card => card.color === 'yellow').length, 0);
    return { status:(!isFinished && count + remainingRings >= target) ? 'pending' : 'failed' };
  }

  if (victory.includes('最少')) {
    const otherCounts = otherIds.map(id => (game.capturedTricks?.[id] || []).length);
    if (!otherCounts.length) return { status:'achieved' };
    if (isFinished) return { status:trickCount <= Math.min(...otherCounts) ? 'achieved' : 'failed' };
    if (trickCount + remainingRounds <= Math.min(...otherCounts)) return { status:'achieved' };
    if (trickCount > Math.min(...otherCounts.map(count => count + remainingRounds))) return { status:'failed' };
    return { status:'pending' };
  }

  if (victory.includes('1か2トリック')) {
    if (trickCount > 2) return { status:'failed' };
    if (trickCount >= 1) return { status:'achieved' };
    return { status:isFinished ? 'failed' : 'pending' };
  }

  if (victory.includes('最大') || victory.includes('最多')) {
    const otherCounts = otherIds.map(id => (game.capturedTricks?.[id] || []).length);
    if (!otherCounts.length) return { status:'achieved' };
    if (isFinished) return { status:trickCount >= Math.max(...otherCounts) ? 'achieved' : 'failed' };
    if (trickCount >= Math.max(...otherCounts.map(count => count + remainingRounds))) return { status:'achieved' };
    if (trickCount + remainingRounds < Math.max(...otherCounts)) return { status:'failed' };
    return { status:'pending' };
  }

  const target = Number(victory.match(/\d+/)?.[0]);
  if (Number.isFinite(target)) {
    if (trickCount >= target) return { status:'achieved' };
    return { status:(!isFinished && trickCount + remainingRounds >= target) ? 'pending' : 'failed' };
  }
  return { status:isFinished ? 'failed' : 'pending' };
}

function chapterOutcome(room){
  const playerIds = room?.game?.playerOrder || [];
  if (!playerIds.length) return null;
  const statuses = playerIds.map(playerId => victoryConditionStatus(room, playerId).status);
  if (statuses.every(status => status === 'achieved')) return 'complete';
  if (statuses.some(status => status === 'failed') || room.game.finished === true) return 'failed';
  return null;
}

let chapterCompleteTimer = null;
let renderedChapterCompleteAt = null;
function renderChapterComplete(){
  clearTimeout(chapterCompleteTimer);
  const outcome = state.game?.chapterOutcome;
  const decidedAt = outcome?.decidedAt || state.game?.allVictoryConditionsAchievedAt;
  if (!decidedAt) {
    document.body.classList.remove('victory-complete');
    renderedChapterCompleteAt = null;
    chapterCompleteBanner.classList.remove('running');
    chapterCompleteBanner.textContent = '';
    return;
  }
  const animationAt = decidedAt + 1000;
  const elapsed = Date.now() - animationAt;
  if (elapsed < 0) {
    document.body.classList.remove('victory-complete');
    chapterCompleteTimer = setTimeout(renderChapterComplete, -elapsed + 10);
    return;
  }
  document.body.classList.add('victory-complete');
  if (elapsed >= 2900 || renderedChapterCompleteAt === decidedAt) return;
  renderedChapterCompleteAt = decidedAt;
  const stage = STAGES.find(item => item.number === Number(state.game?.stageNumber));
  const resultLabel = outcome?.status === 'failed' ? '失敗' : '完';
  chapterCompleteBanner.textContent = `${stage?.chapterLabel || `第${state.game?.stageNumber || ''}章`}　${resultLabel}`;
  chapterCompleteBanner.classList.remove('running');
  chapterCompleteBanner.style.animationDelay = `${-elapsed}ms`;
  void chapterCompleteBanner.offsetWidth;
  chapterCompleteBanner.classList.add('running');
  chapterCompleteBanner.addEventListener('animationend', () => {
    chapterCompleteBanner.classList.remove('running');
    chapterCompleteBanner.style.removeProperty('animation-delay');
  }, { once:true });
}

function createVictoryConditionIcon(cardData, playerId){
  const icon = document.createElement('span');
  icon.className = 'victory-condition-icon';
  const victory = cardData.victory || '';
  const name = cardData.name || '';
  const threatNumber = state.game?.threatCards?.[playerId]?.[0]?.number;
  const waitsForThreat = ['農夫マゴット', 'サム', '馳夫', 'アラゴルン'].includes(name);
  if (waitsForThreat && threatNumber == null) {
    icon.classList.add('awaiting-threat');
    icon.setAttribute('aria-label', '勝利条件：脅威カードのドロー待ち');
    return icon;
  }
  const achieved = hasAchievedVictoryCondition(cardData, playerId);
  icon.classList.toggle('achieved', achieved);

  const square = (text = '', color = 'black') => {
    const item = document.createElement('span');
    item.className = `victory-condition-square ${color}`;
    item.textContent = text;
    if (String(text).length > 2) item.classList.add('wide');
    return item;
  };
  const label = text => {
    const item = document.createElement('span');
    item.className = 'victory-condition-label';
    item.textContent = text;
    return item;
  };
  const line = (...children) => {
    const item = document.createElement('span');
    item.className = 'victory-condition-line';
    item.append(...children);
    return item;
  };
  const sideLabel = (...values) => {
    const item = document.createElement('span');
    item.className = 'victory-condition-side-label';
    values.forEach(value => item.appendChild(label(value)));
    return item;
  };
  const arrow = direction => {
    const item = document.createElement('span');
    item.className = 'victory-condition-arrow';
    item.innerHTML = direction === 'more'
      ? '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1 18 10h-5v9H7v-9H2Z"/></svg>'
      : '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 1h6v9h5l-8 9-8-9h5Z"/></svg>';
    return item;
  };
  const coloredTrick = color => {
    const stack = document.createElement('span');
    stack.className = 'victory-condition-trick';
    stack.appendChild(square('', color));
    return stack;
  };
  const appendOr = (left, right) => {
    const separator = document.createElement('span');
    separator.className = 'victory-condition-or';
    separator.textContent = 'or';
    icon.append(left, separator, right);
  };
  const countSquares = (count, color = 'black') => {
    const items = [];
    if (count >= 4) return [square('', color), label(`x${count}`)];
    for (let index = 0; index < count; index++) items.push(square('', color));
    return items;
  };

  if (name === '馳夫') {
    const choice = state.game?.striderChoices?.[playerId];
    if (threatNumber != null) icon.append(...countSquares(Number(threatNumber)));
    else icon.append(square());
    if (choice) icon.append(arrow(choice));
  } else if (name === 'ギルドール・イングロリオン') {
    icon.append(sideLabel('last', 'play'), square('', 'green'));
  } else if (name === 'ゴールドベリ') {
    icon.append(label('3連'), square());
  } else if (name === '山の下さん') {
    icon.append(label('毎'), square('', 'yellow'));
  } else if (name === 'トム・ボンバディル') {
    icon.append(label('last'), square('?', 'white'), square('?', 'white'), square('?', 'white'));
  } else if (name === 'バーリマン・バタバー') {
    icon.append(square(), label('in last 3'));
  } else if (name === 'グロルフィンデル') {
    icon.append(label('all'), square('', 'red'));
  } else if (name === 'エルロンド') {
    icon.classList.add('multiline');
    icon.append(line(label('all player')), line(square('', 'yellow')));
  } else if (name === 'グローイン') {
    icon.append(label('most'), square('', 'gray'));
  } else if (name === 'アルウェン') {
    icon.append(label('most'), square('', 'green'));
  } else if (name === 'ボロミア') {
    icon.classList.add('multiline');
    const fail = label('✕');
    fail.classList.add('victory-condition-fail');
    icon.append(line(label('last'), square()), line(fail, square('1', 'yellow')));
  } else if (name === 'グワイヒア') {
    icon.append(coloredTrick('gray'), coloredTrick('gray'));
  } else if (name === 'ラダガスト') {
    icon.append(coloredTrick('green'), coloredTrick('green'));
  } else if (name === '飛蔭（とびかげ）') {
    icon.append(coloredTrick('orange'), coloredTrick('orange'));
  } else if (name === 'サム') {
    icon.append(square(String(threatNumber ?? 'x'), 'orange'));
  } else if (name === 'アラゴルン') {
    if (threatNumber != null) icon.append(...countSquares(Number(threatNumber)));
    else icon.append(square());
  } else if (victory.includes('脅威カードと同じ数字')) {
    const matchingSquare = () => square(String(threatNumber ?? 'x'));
    icon.append(matchingSquare());
    if (victory.includes('2枚以上')) icon.append(matchingSquare(), label('以上'));
  } else if (victory.includes('ちょうど1もしくは2')) {
    const oneTrick = line(...countSquares(1));
    const twoTricks = line(...countSquares(2));
    appendOr(oneTrick, twoTricks);
  } else if (victory.includes('最も少ない')) {
    icon.append(square('min'));
  } else if (victory.includes('最も多く')) {
    icon.append(square('most'));
  } else {
    // 補足文に「指輪」が登場するビルボなどは黒のまま。枚数目標が指輪カードの場合だけ黄色にする。
    const color = /指輪カードを\d+枚/.test(victory) ? 'yellow' : 'black';
    const specifiedCount = victory.match(/カードを(\d+)枚/)?.[1]
      || victory.match(/(\d+)トリック/)?.[1];
    if (specifiedCount) {
      icon.append(...countSquares(Number(specifiedCount), color));
    } else {
      const number = victory.match(/\d+/)?.[0] || '';
      icon.append(square(number, color));
    }
    if (victory.includes('以上')) icon.append(label('以上'));
  }
  const status = achieved ? '（達成済み）' : '';
  icon.setAttribute('aria-label', `勝利条件：${victory}${status}`);
  icon.title = `勝利条件：${victory}${status}`;
  return icon;
}

// 4文字までは一行、それ以上も読みやすい位置で分け、必ず二行以内にする。
function appendWrappedCharacterName(element, value){
  const characters = Array.from(value);
  if (characters.length <= 4) {
    if (characters.length === 4) element.classList.add('wide');
    element.textContent = value;
    return;
  }
  const firstLineLength = Math.ceil(characters.length / 2);
  // 一行が4文字になる特殊名は、欄にも少し余裕を持たせる。
  if (firstLineLength === 4) element.classList.add('wide');

  element.append(
    document.createTextNode(characters.slice(0, firstLineLength).join('')),
    document.createElement('br'),
    document.createTextNode(characters.slice(firstLineLength).join(''))
  );
}

// プレイヤーIDは手札だけでなく、ゲーム中のあらゆる保留状態にも使われる。
// 再入室・席奪取時は部屋全体のキーと値を一括で置換し、進行状態を欠落させない。
function replacePlayerId(value, previousId, nextId){
  if (value === previousId) return nextId;
  if (Array.isArray(value)) return value.map(item => replacePlayerId(item, previousId, nextId));
  if (!value || typeof value !== 'object') return value;

  return Object.fromEntries(Object.entries(value).map(([key, item]) => [
    key === previousId ? nextId : key,
    replacePlayerId(item, previousId, nextId)
  ]));
}

function inheritPlayerState(room, previousId, nextId, playerName){
  if (!room || !previousId || previousId === nextId) return room;
  const inherited = replacePlayerId(room, previousId, nextId);
  inherited.users ||= {};
  inherited.users[nextId] = {
    ...(inherited.users[nextId] || {}),
    name: playerName,
    joinedAt: Date.now()
  };
  return inherited;
}

function fitSingleLineText(element, maxSize, minSize = 4){
  element.style.fontSize = `${maxSize}px`;
  const availableWidth = element.clientWidth || element.parentElement?.clientWidth || 0;
  if (!availableWidth || !element.textContent) return;
  const range = document.createRange();
  range.selectNodeContents(element);
  const textWidth = range.getBoundingClientRect().width;
  if (textWidth > availableWidth) {
    element.style.fontSize = `${Math.max(minSize, maxSize * availableWidth / textWidth)}px`;
  }
}

function fitBlockText(element, maxSize, minSize = 4, step = .25){
  element.style.fontSize = `${maxSize}px`;
  if (element.scrollHeight <= element.clientHeight && element.scrollWidth <= element.clientWidth) return;
  let size = maxSize;
  while (size > minSize && (element.scrollHeight > element.clientHeight || element.scrollWidth > element.clientWidth)) {
    size = Math.max(minSize, size - step);
    element.style.fontSize = `${size}px`;
  }
}

}

function exchangeCandidates(game, sourceId){
  const characterName = game?.characterSelections?.[sourceId]?.name;
  const allowedNames = characterName === 'ガンダルフ'
    ? ['フロド']
    : characterName === '馳夫' ? ['フロド']
    : characterName === 'ピピン' ? ['フロド', 'サム', 'メリー']
    : characterName === 'サム' ? ['フロド', 'メリー', 'ピピン']
    : characterName === 'メリー' ? ['フロド', 'サム', 'ピピン'] : [];
  return (game?.playerOrder || []).filter(playerId => playerId !== sourceId
    && allowedNames.includes(game.characterSelections?.[playerId]?.name));
}

function beginNextExchange(game){
  game.exchangeQueue ||= [...(game.effectOrder || game.playerOrder || [])];
  while (game.exchangeQueue.length) {
    const sourceId = game.exchangeQueue[0];
    const characterName = game.characterSelections?.[sourceId]?.name;
    game.effectTurnStartedAt ||= {};
    game.effectTurnStartedAt[sourceId] ||= Date.now();
    drawThreatForCharacterEffect(game, sourceId);
    if (characterName === '馳夫' && !game.striderChoices?.[sourceId]) {
      game.phase = 'strider-comparison';
      game.striderPlayerId = sourceId;
      game.turnPlayerId = null;
      return;
    }
    if (characterName === 'ガンダルフ' && game.excludedCard && !game.gandalfEffectCompleted) {
      game.phase = 'gandalf-selection';
      game.gandalfPlayerId = sourceId;
      game.turnPlayerId = null;
      return;
    }
    game.exchangeQueue.shift();
    if (game.completedExchanges?.[sourceId]) continue;
    const candidates = exchangeCandidates(game, sourceId);
    if (!candidates.length) continue;
    game.pendingExchange = {
      sourceId, candidates,
      targetId:candidates.length === 1 ? candidates[0] : null,
      selectingPlayerId:sourceId, selections:{}, requestedAt:Date.now()
    };
    // 候補が複数でも、カードをどのプレイヤーへ落とすかで交換相手を同時に選ぶ。
    game.phase = 'exchange-card-selection';
    game.turnPlayerId = null;
    return;
  }
  delete game.exchangeQueue;
  delete game.pendingExchange;
  game.phase = 'playing';
  game.turnPlayerId = game.startingPlayerId || game.playerOrder?.[0] || null;
  delete game.startingPlayerId;
  // 最初の1枚は全プレイヤーのキャラクター効果が完了した直後に公開する。
  drawOldForestCard(game);
}

function drawOldForestCard(game){
  if (Number(game?.stageNumber) !== 5 || !game.oldForestDeck?.length) return;
  game.oldForestRevealed = game.oldForestDeck.shift();
}

function drawThreatForCharacterEffect(game, playerId){
  const characterName = game.characterSelections?.[playerId]?.name;
  if (!['農夫マゴット', 'サム', '馳夫', 'アラゴルン'].includes(characterName)) return;
  game.threatCards ||= {};
  if ((game.threatCards[playerId] || []).length) return;
  const stage = STAGES.find(item => item.number === Number(game.stageNumber));
  const threat = stage?.threats?.[0] || { name:'脅威カード', min:1, max:4 };
  const usedNumbers = new Set(Object.values(game.threatCards)
    .flatMap(cards => cards || []).map(card => Number(card.number)));
  const availableNumbers = Array.from(
    { length:threat.max - threat.min + 1 }, (_, index) => threat.min + index
  ).filter(number => !usedNumbers.has(number));
  if (!availableNumbers.length) return;
  const rank = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
  game.threatCards[playerId] = [{
    kind:'threat', color:'threat', name:threat.name, number:rank,
    id:`${playerId}-threat-${Date.now()}-${rank}`
  }];
}

function beginCharacterEffectTurns(game){
  const order = game.playerOrder || [];
  const startingPlayerId = game.startingPlayerId || order[0];
  const startingIndex = Math.max(0, order.indexOf(startingPlayerId));
  // 効果ターンは常にスタートプレイヤーから席順に処理する。
  game.effectOrder = [...order.slice(startingIndex), ...order.slice(0, startingIndex)];
  game.exchangeQueue = [...game.effectOrder];
}

function continueAfterCharacterEffects(game){
  beginNextExchange(game);
}

async function takeExcludedCardAsGandalf(){
  if (!state.roomCode || state.game?.phase !== 'gandalf-selection' || state.game?.gandalfPlayerId !== state.userId) return;
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    const game = room?.game;
    if (!game?.excludedCard || game.phase !== 'gandalf-selection' || game.gandalfPlayerId !== state.userId) return;
    room.hands ||= {};
    room.hands[state.userId] ||= { cards:[] };
    room.hands[state.userId].cards ||= [];
    room.hands[state.userId].cards.push(game.excludedCard);
    game.lostCardTransfer = { cardId:game.excludedCard.id, playerId:state.userId, movedAt:Date.now() };
    delete game.excludedCard;
    game.gandalfEffectCompleted = true;
    // ロストカード取得に続けてガンダルフの交換を行い、その後に次の効果ターンへ進む。
    beginNextExchange(game);
    return room;
  });
}

function animateLostCard(sourceRect, transfer){
  if (!sourceRect || !transfer?.cardId) return;
  const target = transfer.playerId === state.userId
    ? myHandEl.querySelector(`[data-card-id="${CSS.escape(transfer.cardId)}"]`)
    : playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(transfer.playerId)}"] .mini-card:last-child`);
  const targetRect = target?.getBoundingClientRect();
  const cardData = state.hands?.[transfer.playerId]?.cards?.find(card => card.id === transfer.cardId);
  if (!targetRect || !cardData) return;
  const flight = createCardElement(cardData);
  flight.classList.add('lost-card-flight');
  flight.style.left = `${sourceRect.left}px`;
  flight.style.top = `${sourceRect.top}px`;
  flight.style.transform = `scale(${sourceRect.width / 82})`;
  document.body.appendChild(flight);
  flight.animate([
    { left:`${sourceRect.left}px`, top:`${sourceRect.top}px`, transform:`scale(${sourceRect.width / 82})`, opacity:1 },
    { left:`${targetRect.left}px`, top:`${targetRect.top}px`, transform:`scale(${transfer.playerId === state.userId ? currentHandCardScale() : targetRect.width / 82})`, opacity:1 }
  ], { duration:800, easing:'cubic-bezier(.22,.8,.25,1)', fill:'forwards' }).finished.finally(() => {
    flight.remove();
    target.style.removeProperty('opacity');

function captureExchangePositions(){

  playerCircle.querySelectorAll('.exchange-received-card[data-card-id]').forEach(card => positions.set(`card:${card.dataset.cardId}`, card.getBoundingClientRect()));
  exchangeDropPositions.forEach((rect, cardId) => positions.set(`card:${cardId}`, rect));

function animateExchangeOffer(transfer, oldPositions){
  if (!transfer?.movedAt || transfer.movedAt === lastAnimatedExchangeOfferAt) return;
  lastAnimatedExchangeOfferAt = transfer.movedAt;
  const from = oldPositions.get(`card:${transfer.card?.id}`) || oldPositions.get(transfer.sourceId);
  const target = playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(transfer.targetId)}"] .exchange-received-card`);
  const to = target?.getBoundingClientRect();
  if (!from || !to) return;
  const flight = document.createElement('div');
  flight.classList.add('exchange-card-flight', 'exchange-offer-flight', 'card-back');
  const startScale = transfer.sourceId === state.userId
    ? currentHandCardScale()
    : Math.min(from.width / 82, from.height / 122, 1);
  const endScale = Math.min(to.width / 82, to.height / 122, 1);
  const fromWidth = transfer.sourceId === state.userId ? 82 * startScale : from.width;
  const fromHeight = transfer.sourceId === state.userId ? 122 * startScale : from.height;
  const angle = transfer.tilt || 0;
  const fromLeft = from.left + fromWidth / 2 - 41;
  const fromTop = from.top + fromHeight / 2 - 61;
  const toLeft = to.left + to.width / 2 - 41;
  const toTop = to.top + to.height / 2 - 61;
  flight.style.left = `${fromLeft}px`;
  flight.style.top = `${fromTop}px`;
  flight.style.transform = `scale(${startScale}) rotate(${angle}deg)`;
  target.style.opacity = '0';
  document.body.appendChild(flight);
  flight.animate([
    { left:`${fromLeft}px`, top:`${fromTop}px`, transform:`scale(${startScale}) rotate(${angle}deg)`, opacity:1 },
    { left:`${toLeft}px`, top:`${toTop}px`, transform:`scale(${endScale}) rotate(${angle}deg)`, opacity:1 }
  ], { duration:1400, easing:'cubic-bezier(.22,.8,.25,1)', fill:'forwards' }).finished.finally(() => {
    flight.remove();
    target.style.removeProperty('opacity');
    exchangeDropPositions.delete(transfer.card.id);
  });
}

function animateExchangeTransfer(transfer, oldPositions){
  if (!transfer?.completedAt || transfer.completedAt === lastAnimatedExchangeAt) return;
  lastAnimatedExchangeAt = transfer.completedAt;
  [
    { card:transfer.sourceCard, fromId:transfer.sourceId, toId:transfer.targetId },
    { card:transfer.targetCard, fromId:transfer.targetId, toId:transfer.sourceId }
  ].forEach(({ card, fromId, toId }) => {
    if (!card) return;
    const from = oldPositions.get(`card:${card.id}`) || oldPositions.get(fromId);
    const exactTarget = toId === state.userId ? myHandEl.querySelector(`[data-card-id="${CSS.escape(card.id)}"]`) : null;
    const targetElement = exactTarget
      || playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(toId)}"] .mini-hand`)
      || playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(toId)}"]`);
    const to = targetElement?.getBoundingClientRect();
    if (!from || !to) return;
    // 交換内容は本人を含めて移動中には公開せず、常に裏向きで見せる。
    const flight = document.createElement('div');
    flight.classList.add('exchange-card-flight', 'card-back');
    const isReturnedOffer = transfer.returnedOfferedCard && card.id === transfer.targetCard?.id;
    const startScale = isReturnedOffer
      ? .66
      : fromId === state.userId
      ? currentHandCardScale()
      : Math.min(from.width / 82, from.height / 122, 1);
    const endScale = toId === state.userId
      ? currentHandCardScale()
      : Math.min(to.width / 82, to.height / 122, 1);
    flight.style.left = `${from.left}px`;
    flight.style.top = `${from.top}px`;
    flight.style.transform = `scale(${startScale})`;
    document.body.appendChild(flight);
    if (exactTarget) exactTarget.style.opacity = '0';
    flight.animate([
      { left:`${from.left}px`, top:`${from.top}px`, transform:`scale(${startScale})`, opacity:1 },
      { left:`${to.left}px`, top:`${to.top}px`, transform:`scale(${endScale})`, opacity:1 }
    ], { duration:1400, easing:'cubic-bezier(.22,.8,.25,1)', fill:'forwards' }).finished.finally(() => {
      flight.remove();
      exactTarget?.style.removeProperty('opacity');
      exchangeDropPositions.delete(card.id);
    });
  });
}

function animateMyHandReflow(previousRects){
  myHandEl.querySelectorAll('[data-card-id]').forEach(card => {
    const previous = previousRects.get(card.dataset.cardId);
    if (!previous) return;
    const current = card.getBoundingClientRect();
    const x = previous.left - current.left;
    const y = previous.top - current.top;
    if (Math.abs(x) < 1 && Math.abs(y) < 1) return;
    // 除外カード追加で既存カードの並びが変わっても、旧位置から滑らかに詰め直す。
    card.animate([
      { transform:`translate(${x}px,${y}px)` },
      { transform:'translate(0,0)' }
    ], { duration:500, easing:'cubic-bezier(.22,.8,.25,1)' });
  });
}

function subscribeRoom(){
  const roomRef = ref(db, `rooms/${state.roomCode}`);
  onValue(roomRef, snap => {
    const previousTransferAt = state.game?.lostCardTransfer?.movedAt;
    const excludedSourceRect = state.game?.excludedCard ? excludedCardSlot.getBoundingClientRect() : null;
    const previousMyHandRects = captureMyHandRects();
    const previousExchangePositions = captureExchangePositions();
    state.room = snap.val() || {};
    state.game = state.room.game || null;
    state.hands = state.room.hands || {};
    const waiting = (!state.isHost && !state.room.maxPlayers);
    hostSelectingPop.classList.toggle('hidden', !waiting);
    renderHands();
    renderStageInformation();
    renderYellowOneDecision();
    renderExchangeDialog();
    renderStriderChoice();
    renderChapterComplete();
    const exchangeOfferTransfer = state.game?.exchangeOfferTransfer;
    if (exchangeOfferTransfer?.movedAt && exchangeOfferTransfer.movedAt !== lastAnimatedExchangeOfferAt) {
      requestAnimationFrame(() => animateExchangeOffer(exchangeOfferTransfer, previousExchangePositions));
    }
    const selectionAvailableAt = state.game?.pendingExchange?.selectionAvailableAt;
    if (selectionAvailableAt && Date.now() < selectionAvailableAt) {
      setTimeout(() => {
        renderHands();
        renderExchangeDialog();
        // 受取カードのドラッグ可否も到着時刻で切り替わるため、プレイヤー周りを再描画する。
        renderPlayerCircle(latestPlayers);
      }, selectionAvailableAt - Date.now() + 20);
    }
    const exchangeTransfer = state.game?.exchangeTransfer;
    if (exchangeTransfer?.completedAt && exchangeTransfer.completedAt !== lastAnimatedExchangeAt) {
      requestAnimationFrame(() => animateExchangeTransfer(exchangeTransfer, previousExchangePositions));
    }
    const transfer = state.game?.lostCardTransfer;
    if (transfer?.movedAt && transfer.movedAt !== previousTransferAt && excludedSourceRect) {
      requestAnimationFrame(() => {
        animateMyHandReflow(previousMyHandRects);
        animateLostCard(excludedSourceRect, transfer);
      });
    }
    scheduleTrickClear();
    syncSeatUI();
  });
}

function attachTwoSecondHold(button, action){

  };
  button.addEventListener('click', event => event.preventDefault());
  button.addEventListener('pointerdown', event => {
    if (event.button !== undefined && event.button !== 0) return;

    button.setPointerCapture(event.pointerId);
    animation = button.animate([{ '--hold-progress':'0' }, { '--hold-progress':'1' }], { duration:2000, fill:'forwards' });
    timer = setTimeout(() => { cancel(); action(); }, 2000);
  });
  button.addEventListener('pointerup', cancel);
  button.addEventListener('pointercancel', cancel);
  button.addEventListener('lostpointercapture', cancel);
}

async function chooseExchangeTarget(targetId){

async function chooseExchangeCard(cardId, droppedTargetId){
  if (!state.roomCode) return;
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    const game = room?.game;
    const exchange = game?.pendingExchange;
    if (game?.phase !== 'exchange-card-selection' || !exchange
      || (exchange.selectingPlayerId || exchange.sourceId) !== state.userId
      || (exchange.selectionAvailableAt && Date.now() < exchange.selectionAvailableAt)
      || exchange.selections?.[state.userId]) return;
    if (!exchange.targetId && state.userId === exchange.sourceId) {
      if (!exchange.candidates?.includes(droppedTargetId)) return;
      exchange.targetId = droppedTargetId;
    }
    if (!exchange.targetId) return;
    const offeredCard = state.userId === exchange.targetId
      && game.exchangeOfferTransfer?.card?.id === cardId
      ? game.exchangeOfferTransfer.card
      : null;
    const card = (room.hands?.[state.userId]?.cards || []).find(item => item.id === cardId) || offeredCard;
    if (!card || card.kind === 'character' || (card.color === 'yellow' && card.number === 1)) return;
    exchange.selections ||= {};
    exchange.selections[state.userId] = cardId;
    if (state.userId === exchange.sourceId) {
      // 交換者が先に渡すカードを確定し、到着演出後に相手へ選択を依頼する。
      exchange.selectingPlayerId = exchange.targetId;
      game.exchangeOfferTransfer = {
        sourceId:exchange.sourceId, targetId:exchange.targetId, card,
        tilt:Math.floor(Math.random() * 5) - 2, movedAt:Date.now()
      };
      exchange.selectionAvailableAt = game.exchangeOfferTransfer.movedAt + 1400;
      return room;
    }
    const sourceCardId = exchange.selections[exchange.sourceId];
    const targetCardId = exchange.selections[exchange.targetId];
    if (!sourceCardId || !targetCardId) return room;
    const sourceCards = room.hands[exchange.sourceId].cards;
    const targetCards = room.hands[exchange.targetId].cards;
    const sourceIndex = sourceCards.findIndex(item => item.id === sourceCardId);
    const targetIndex = targetCards.findIndex(item => item.id === targetCardId);
    if (sourceIndex < 0 || (targetIndex < 0 && targetCardId !== sourceCardId)) return;
    const sourceCard = sourceCards[sourceIndex];
    const returnedOfferedCard = targetCardId === sourceCardId;
    const targetCard = returnedOfferedCard ? sourceCard : targetCards[targetIndex];
    if (!returnedOfferedCard) {
      [sourceCards[sourceIndex], targetCards[targetIndex]] = [targetCards[targetIndex], sourceCards[sourceIndex]];
    }
    game.exchangeTransfer = {
      sourceId:exchange.sourceId, targetId:exchange.targetId,
      // 渡されたカードをそのまま返した場合は、その一枚だけを相手側から戻す演出にする。
      sourceCard:returnedOfferedCard ? null : sourceCard,
      targetCard, returnedOfferedCard, completedAt:Date.now()
    };
    // 空になった配列はRealtime Database上で消えるため、完了者を別途記録して再実行を防ぐ。
    game.completedExchanges ||= {};
    game.completedExchanges[exchange.sourceId] = true;
    delete game.exchangeOfferTransfer;
    delete game.pendingExchange;
    beginNextExchange(game);
    return room;
  });
}

async function decideYellowOne(wins){
  if (!state.roomCode) return;
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    const pending = room?.game?.pendingYellowOneDecision;
    if (!pending || pending.playerId !== state.userId) return;
    const winnerId = wins ? pending.playerId : pending.normalWinnerId;
    room.game.lastWinnerId = winnerId;
    room.game.tricksWon ||= {};
    room.game.tricksWon[winnerId] = (room.game.tricksWon[winnerId] || 0) + 1;
    const gatherAt = Date.now() + 250;
    room.game.pendingCapture = {
      winnerId, cards:pending.cards,
      winningCardId:wins ? pending.yellowOneCardId : pending.normalWinningCardId,
      gatherAt, captureAt:gatherAt + 700
    };
    room.game.turnPlayerId = winnerId;
    room.game.trickNumber = (room.game.trickNumber || 1) + 1;
    if ((room.game.playerOrder || []).every(id => !(room.hands?.[id]?.cards || []).some(card => card.kind !== 'character'))) room.game.finished = true;
    delete room.game.pendingYellowOneDecision;
    return room;
  });
}

function scheduleTrickClear(){
  clearTimeout(trickClearTimer);
  const gatherAt = state.game?.pendingCapture?.gatherAt;
  const captureAt = state.game?.pendingCapture?.captureAt;
  if (!captureAt || !state.roomCode) return;
  if (gatherAt && Date.now() < gatherAt) {
    trickClearTimer = setTimeout(() => {
      renderHands();
      scheduleTrickClear();
    }, Math.max(0, gatherAt - Date.now()) + 20);
    return;
  }
  trickClearTimer = setTimeout(async () => {
    await runTransaction(ref(db, `rooms/${state.roomCode}/game`), game => {
      const pending = game?.pendingCapture;
      if (!pending || pending.captureAt !== captureAt || Date.now() < captureAt) return;
      game.capturedCards ||= {};
      game.capturedCards[pending.winnerId] ||= [];
      game.capturedCards[pending.winnerId].push(...pending.cards);
      game.capturedTricks ||= {};
      game.capturedTricks[pending.winnerId] ||= [];
      game.capturedTricks[pending.winnerId].push({
        cards: pending.cards,
        winningCardId: pending.winningCardId
      });
      delete game.trick;
      delete game.pendingCapture;
      // 獲得カードの移動が完了してから、次のトリック用の森カードを公開する。
      if (!game.finished) drawOldForestCard(game);
      const outcome = chapterOutcome({ game, hands:state.room?.hands || {} });
      if (!game.chapterOutcome && outcome) {
        game.chapterOutcome = { status:outcome, decidedAt:Date.now() };
      }
      return game;
    });
  }, Math.max(0, captureAt - Date.now()) + 20);
}

function renderMyHand(){
  myHandEl.innerHTML = '';
  myHandEl.classList.remove('has-playable-cards', 'overlapping-cards', 'exchange-pickable');
  myHandEl.style.removeProperty('--hand-columns');
  const myId = state.userId;
  const handData = state.hands[myId];
  if (!handData || !Array.isArray(handData.cards)) return;

  const character = handData.cards.find(card => card?.kind === 'character');
  const characterIsWaiting = Boolean(character) && Date.now() < (characterAnimationUntil.get(myId) || 0);
  // 選択開始時からキャラクター用の先頭枠を確保し、選択・到着時に数字カードを動かさない。
  const reserveCharacterSlot = state.game?.phase === 'character-selection' || characterIsWaiting;
  const cardCount = handData.cards.length + (!character && reserveCharacterSlot ? 1 : 0);
  const numberCardCount = handData.cards.filter(card => card?.kind !== 'character').length;
  myHandEl.classList.toggle('overlapping-cards', numberCardCount >= 6);
  // 数字カードが7枚以上なら、1段目を「キャラクター+数字6枚」に固定して残りを2段目へ送る。
  const columnCount = numberCardCount >= 7 ? 7 : Math.max(cardCount, 1);
  myHandEl.style.setProperty('--hand-columns', columnCount);
  // 最大段の実占有幅を基準に、キャラクターカードを含む全カードを同じ倍率で収める。
  const upperCardCount = Math.min(cardCount, numberCardCount >= 7 ? 7 : cardCount);
  const overlapReduction = numberCardCount >= 6 ? Math.max(0, Math.min(numberCardCount, 6) - 1) * 13 : 0;
  const characterSpacing = character || reserveCharacterSlot ? (numberCardCount ? 8 : 0) : 0;
  const naturalWidth = upperCardCount * 82 + Math.max(0, upperCardCount - 1) * 10 - overlapReduction + characterSpacing;
  const handScale = Math.min(1, Math.max(.25, (window.innerWidth - 24) / Math.max(82, naturalWidth)));
  myHandEl.style.setProperty('--hand-card-scale', handScale);
  // 上段の表示倍率にかかわらず、下段との見た目上の間隔を2pxに保つ。
  myHandEl.style.setProperty('--lower-row-offset', `${122 * handScale - 84}px`);
  // 行全体が縮小されても、勝利条件の四角は常に15px、カードとの間隔は常に5pxに保つ。
  myHandEl.style.setProperty('--victory-icon-scale', 1 / handScale);
  myHandEl.style.setProperty('--victory-icon-top', `${122 + 5 / handScale}px`);
  const upperRow = document.createElement('div');
  upperRow.className = 'hand-row hand-row-upper';
  const lowerRow = document.createElement('div');
  lowerRow.className = 'hand-row hand-row-lower';
  myHandEl.append(upperRow, lowerRow);

  let hasPlayableCards = false;
  const exchange = state.game?.pendingExchange;
  const canChooseExchangeCard = state.game?.phase === 'exchange-card-selection'
    && exchange && !exchange.selections?.[myId]
    && (exchange.selectingPlayerId || exchange.sourceId) === myId
    && (!exchange.selectionAvailableAt || Date.now() >= exchange.selectionAvailableAt);
  const selectedExchangeCardId = exchange?.selections?.[myId];
  const colorOrder = { red: 0, green: 1, orange: 2, gray: 3, yellow: 4 };
  const displayedCards = handData.cards.map((cardData, cardIndex) => ({
    // 古いルームに残っている数字カードも表示を壊さない。
    normalized: (typeof cardData === 'object' && cardData)
      ? cardData
      : { color: 'gray', name: '山', number: cardData },
    cardIndex
  })).filter(({ normalized }) => normalized.id !== selectedExchangeCardId)
    .filter(({ normalized }) => normalized.kind !== 'character' || !characterIsWaiting).sort((left, right) => {
    if (left.normalized.kind === 'character') return right.normalized.kind === 'character' ? 0 : -1;
    if (right.normalized.kind === 'character') return 1;
    const typeDifference = (colorOrder[left.normalized.color] ?? 3) - (colorOrder[right.normalized.color] ?? 3);
    return typeDifference || (Number(left.normalized.number) || 0) - (Number(right.normalized.number) || 0);
  });

  if (reserveCharacterSlot && (!character || characterIsWaiting)) {
    const characterSlot = document.createElement('div');
    characterSlot.className = 'character-card-slot';
    characterSlot.setAttribute('aria-hidden', 'true');
    upperRow.appendChild(characterSlot);
  }

  let displayedNumberIndex = 0;
  displayedCards.forEach(({ normalized, cardIndex }) => {
    const card = createCardElement(normalized);
    if (normalized.kind !== 'character') {
      card.style.setProperty('--card-stack-index', displayedNumberIndex);
      displayedNumberIndex += 1;
    }
    const canPlay = normalized.kind !== 'character' && state.game?.phase === 'playing'
      && !state.game.pendingCapture && !state.game.pendingYellowOneDecision
      && state.game.turnPlayerId === myId && canFollowSuit(normalized);
    if (canPlay) {
      hasPlayableCards = true;
      card.classList.add('playable');
      card.addEventListener('pointerdown', event => beginCardDrag(event, normalized, cardIndex, card));
    }
    const canExchange = canChooseExchangeCard && normalized.kind !== 'character'
      && !(normalized.color === 'yellow' && normalized.number === 1);
    if (canExchange) {
      card.classList.add('exchange-pick');
      card.addEventListener('pointerdown', event => beginExchangeCardDrag(event, normalized, card));
    }
    const cardRow = normalized.kind === 'character' || displayedNumberIndex <= 6 ? upperRow : lowerRow;
    if (normalized.kind === 'character') {
      const characterUnit = document.createElement('div');
      characterUnit.className = 'character-card-unit';
      characterUnit.append(card, createVictoryConditionIcon(normalized, myId));
      cardRow.appendChild(characterUnit);
    } else cardRow.appendChild(card);
  });
  myHandEl.classList.toggle('has-playable-cards', hasPlayableCards);
  myHandEl.classList.toggle('exchange-pickable', canChooseExchangeCard);
}

function beginExchangeCardDrag(event, cardData, source){
  if (event.button !== undefined && event.button !== 0) return;
  event.preventDefault();
  const exchange = state.game?.pendingExchange;
  const targetIds = exchange?.sourceId === state.userId
    ? (exchange.targetId ? [exchange.targetId] : exchange.candidates || [])
    : [exchange?.sourceId].filter(Boolean);
  const targets = targetIds.map(playerId => {
    const tag = playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(playerId)}"]`);
    return { playerId, tag, hint:tag?.querySelector('.exchange-hand-hint') };
  }).filter(target => target.hint);
  if (!targets.length) return;
  // 交換候補が複数いる間は、ドラッグ先を選べるよう全候補のヒントを同時に点灯する。
  targets.forEach(target => target.tag.classList.add('exchange-drag-target'));
  source.setPointerCapture(event.pointerId);
  source.classList.add('drag-source');
  const floating = createCardElement(cardData);
  floating.classList.add('drag-card');
  floating.style.setProperty('--drag-card-scale', source.classList.contains('exchange-received-card') ? .66 : currentHandCardScale());
  document.body.appendChild(floating);
  const move = currentEvent => {
    floating.style.left = `${currentEvent.clientX}px`;
    floating.style.top = `${currentEvent.clientY}px`;
  };
  const cancel = () => {
    floating.remove();
    source.classList.remove('drag-source');
    targets.forEach(target => target.tag.classList.remove('exchange-drag-target'));
  };
  const finish = currentEvent => {
    source.removeEventListener('pointermove', move);
    source.removeEventListener('pointerup', finish);
    source.removeEventListener('pointercancel', cancel);
    const droppedTarget = targets.find(({ hint }) => {
      const rect = hint.getBoundingClientRect();
      return currentEvent.clientX >= rect.left && currentEvent.clientX <= rect.right
        && currentEvent.clientY >= rect.top && currentEvent.clientY <= rect.bottom;
    });
    if (droppedTarget) {
      const rect = droppedTarget.hint.getBoundingClientRect();
      exchangeDropPositions.set(cardData.id, {
        left:rect.left + rect.width / 2 - 27, top:rect.top + rect.height / 2 - 40.5,
        width:54, height:81
      });
    }
    cancel();
    if (droppedTarget) chooseExchangeCard(cardData.id, droppedTarget.playerId);
  };
  move(event);
  source.addEventListener('pointermove', move);
  source.addEventListener('pointerup', finish, { once:true });
  source.addEventListener('pointercancel', cancel, { once:true });
}

function canFollowSuit(card){
  const trick = state.game?.trick || {};
  const plays = Object.values(trick);
  if (!plays.length) return card.color !== 'yellow' || state.game?.ringCircleOn === true;
  const leadColor = plays.sort((a,b) => a.order-b.order)[0].card.color;
  const cards = (state.hands[state.userId]?.cards || []).filter(card => card.kind !== 'character');
  return card.color === leadColor || !cards.some(c => c.color === leadColor);
}

let selfDropPoint = null;

function beginCardDrag(event, cardData, cardIndex, source){
  if (event.button !== undefined && event.button !== 0) return;
  event.preventDefault();
  source.setPointerCapture(event.pointerId);
  source.classList.add('drag-source');
  playerCircle.classList.add('dragging');
  const floating = createCardElement(cardData);
  floating.classList.add('drag-card');
  const sourceScale = currentHandCardScale();
  const sourceWidth = 82 * sourceScale;
  const sourceHeight = 122 * sourceScale;
  floating.style.setProperty('--drag-card-scale', sourceScale);
  document.body.appendChild(floating);
  const move = e => { floating.style.left = `${e.clientX}px`; floating.style.top = `${e.clientY}px`; };
  move(event);
  const finish = async e => {
    source.removeEventListener('pointermove', move);
    source.removeEventListener('pointerup', finish);
    source.removeEventListener('pointercancel', cancel);
    floating.remove(); source.classList.remove('drag-source'); playerCircle.classList.remove('dragging');
    const target = playerCircle.querySelector('.play-circle.mine');
    const rect = target?.getBoundingClientRect();
    // ヒント円の見た目は変えず、指でドロップしやすいよう判定だけを外側へ広げる。
    const dropPadding = 28;
    if (rect && e.clientX >= rect.left - dropPadding && e.clientX <= rect.right + dropPadding
      && e.clientY >= rect.top - dropPadding && e.clientY <= rect.bottom + dropPadding) {
      // 場への移動開始時も、縮小後の手札カードと同じ見た目の大きさから開始する。
      selfDropPoint = {
        left:e.clientX - sourceWidth / 2,
        top:e.clientY - sourceHeight / 2,
        scale:sourceWidth / 54
      };
      await playCard(cardIndex, cardData);
    }
  };
  const cancel = () => { floating.remove(); source.classList.remove('drag-source'); playerCircle.classList.remove('dragging'); };
  source.addEventListener('pointermove', move);
  source.addEventListener('pointerup', finish, { once:true });
  source.addEventListener('pointercancel', cancel, { once:true });
}

async function playCard(cardIndex, expectedCard){
  if (!state.roomCode) return;
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    if (!room?.game || room.game.phase !== 'playing' || room.game.pendingCapture
      || room.game.pendingYellowOneDecision || room.game.turnPlayerId !== state.userId) return;
    const hand = room.hands?.[state.userId]?.cards;
    const card = hand?.[cardIndex];
    if (!card || card.kind === 'character' || card.id !== expectedCard.id) return;
    const existing = Object.values(room.game.trick || {}).sort((a,b)=>a.order-b.order);
    if (!existing.length && card.color === 'yellow' && room.game.ringCircleOn !== true) return;
    if (existing.length) {
      const lead = existing[0].card.color;
      if (card.color !== lead && hand.some(c => c.color === lead)) return;
    }
    hand.splice(cardIndex, 1);
    room.hands[state.userId].cards = hand;
    if (card.color === 'yellow') room.game.ringCircleOn = true;
    room.game.trick ||= {};
    room.game.trick[state.userId] = { card, order: existing.length, tilt: Math.floor(Math.random()*5)-2 };
    const order = room.game.playerOrder;
    // 配り切りで手札枚数に1枚差がある場合、カードが残っているプレイヤーだけで最後のトリックを行う。
    const trickPlayers = order.filter(id => room.game.trick[id]
      || (room.hands[id]?.cards || []).some(handCard => handCard.kind !== 'character'));
    if (existing.length + 1 === trickPlayers.length) {
      const plays = [...existing, room.game.trick[state.userId]];
      const lead = plays[0].card.color;
      const winnerPlay = plays.filter(p=>p.card.color===lead).reduce((best,p)=>p.card.number>best.card.number?p:best);
      const winnerId = Object.entries(room.game.trick).find(([,p])=>p===winnerPlay)?.[0] || state.userId;
      const yellowOneEntry = Object.entries(room.game.trick)
        .find(([, play]) => play.card.color === 'yellow' && play.card.number === 1);
      if (yellowOneEntry && yellowOneEntry[0] !== winnerId) {
        // 通常判定では黄1が勝てない場合だけ、所持者の選択まで回収を保留する。
        room.game.pendingYellowOneDecision = {
          playerId:yellowOneEntry[0], normalWinnerId:winnerId,
          cards:plays.map(p => p.card), normalWinningCardId:winnerPlay.card.id,
          yellowOneCardId:yellowOneEntry[1].card.id, requestedAt:Date.now()
        };
        room.game.turnPlayerId = null;
      } else {
        room.game.lastWinnerId = winnerId;
        room.game.tricksWon ||= {};
        room.game.tricksWon[winnerId] = (room.game.tricksWon[winnerId] || 0) + 1;
        const gatherAt = Date.now() + 2000;
        room.game.pendingCapture = {
          winnerId, cards:plays.map(p => p.card), winningCardId:winnerPlay.card.id,
          gatherAt, captureAt:gatherAt + 700
        };
        room.game.turnPlayerId = winnerId;
        room.game.trickNumber = (room.game.trickNumber || 1) + 1;
        if (order.every(id => !(room.hands[id]?.cards || []).some(card => card.kind !== 'character'))) room.game.finished = true;
      }
    } else {
      const currentIndex = order.indexOf(state.userId);
      room.game.turnPlayerId = Array.from({ length: order.length - 1 }, (_, offset) => order[(currentIndex + offset + 1) % order.length])
        .find(id => !room.game.trick[id] && (room.hands[id]?.cards || []).some(handCard => handCard.kind !== 'character'));
    }
    return room;
  });
}

function exchangeEffectText(character){
  const exchangeTargetCodes = {
    pippin:['frodo', 'sam', 'merry'],
    sam:['frodo', 'merry', 'pippin'],
    merry:['frodo', 'sam', 'pippin']
  };
  const sourceCode = character.code
    || Object.entries(CHARACTER_NAMES).find(([, name]) => name === character.name)?.[0];
  const allowedCodes = exchangeTargetCodes[sourceCode];
  if (!allowedCodes) return null;
  const targetNames = allowedCodes.map(code => CHARACTER_NAMES[code]);
  if (targetNames.length === 1) return `${targetNames[0]}と交換する。`;
  return `${targetNames.join('/')}の誰かと交換する。`;
}

function animateCharacterSelection(playerId, character, sourceRect){
  const isMe = playerId === state.userId;
  // 自分は手札の先頭枠、他プレイヤーは公開キャラクター専用の獲得カード枠を着地点にする。
