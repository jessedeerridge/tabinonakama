<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>指輪物語 旅の仲間</title>
<style>
  html, body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#111;}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #eee; position:sticky; top:0; z-index:400; background:#fff;}
  h1{margin:0;font-size:18px;}
  .small{font-size:12px;opacity:.75;}
  .join-box{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px; position:relative; z-index:2;}
  .join-box input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:16px;}
  .btn{padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:#f8f8f8;cursor:pointer;}
  .btn.primary{background:#111;color:#fff;border-color:#111;}
  .btn.ghost{background:transparent;}
  .hidden{display:none;}
  #lobby{padding:20px;border-top:1px solid #eee; position:relative; z-index:2;}
  .copy-btn.copied, .btn.ghost.copied{background:#16a34a;color:#fff;border-color:#16a34a;}

  /* ★ main背景：入室前/入室後で切替 */
  main{
    position:relative;
    height:calc(100vh - 60px);
    overflow:hidden;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  main.prejoin{ background-image:url('tabinonakamaback.jpg'); }
  main.joined{ background-image:url('tabibitomain.jpg'); }

  /* ★ 着席ポップ */
  .seat-pop{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    background:orange;border:1px solid #eee;border-radius:12px;
    box-shadow:0 12px 28px rgba(0,0,0,.12);
    padding:10px;z-index:220;display:flex;flex-direction:column;gap:10px;min-width:280px;
  }
  .seat-pop.hidden{display:none;}
  .seat-pop .row{display:flex;gap:8px;align-items:center;}
  .seat-pop label{width:84px;font-size:13px;}
  .seat-pop .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:6px 10px;border:1px solid #ddd;border-radius:999px;cursor:pointer;user-select:none;position:relative;}
  .tab.disabled{opacity:.45; pointer-events:none;}
  .tab.disabled::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700;color:#b91c1c;pointer-events:none;}
  .tab.active{background:#111;color:#fff;border-color:#111;}

  /* ★ ホスト人数選択中：参加者に出す黒ポップ（下固定） */
  .host-selecting-pop{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    background:rgba(20,20,20,.92);color:#fff;
    padding:12px 16px;border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
    z-index:225;font-weight:800;white-space:nowrap;
    pointer-events:none;
  }
  .host-selecting-pop.hidden{display:none;}

  /* ★ プレイヤー円配置用 */
  .player-circle{
    position:relative;width:min(76vw,420px);height:min(76vw,420px);
    margin:8px auto 0;border-radius:50%;
    box-sizing:border-box;border:none;
  }
  .player-circle::before{content:'';}
  .player-tag{
    position:absolute;transform:translate(-50%,-50%);
    padding:4px 8px;border-radius:999px;background:#f8f8f8;
    border:1px solid #ddd;font-size:12px;white-space:nowrap;
  }
  .player-tag.me{ background:#111;color:#fff;border-color:#111; }
  .player-tag.me{margin-top:12px;}

  /* 他プレイヤーのミニカード（ネームタグの下に扇状） */
  .player-tag .mini-hand{
    position:absolute;left:50%;top:100%;
    transform:translate(-50%,3px);
    width:100px;height:56px;pointer-events:none;
  }
  .player-tag .mini-card{
    position:absolute;left:50%;top:0;width:32px;height:44px;
    border-radius:6px;border:1px solid #bbb;
    background:#fff url('tabicardura.jpg') center/cover no-repeat;
    font-size:10px;display:flex;align-items:center;justify-content:center;
    transform-origin:bottom center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }

  /* 自分の手札表示（大きめ横並び） */
  .my-hand-wrapper{margin-top:23px;text-align:center;}
  .my-hand-title{display:none;}
  .my-hand{display:flex;width:calc(var(--hand-columns,1) * 82px + (var(--hand-columns,1) - 1) * 10px + 24px);box-sizing:border-box;flex-direction:column;align-items:center;gap:10px;margin:6px auto 0;min-height:132px;padding:0 12px;}
  .hand-row{display:flex;justify-content:center;gap:10px;min-height:122px;}
  .hand-row:empty{display:none;}
  /* 実際の占有幅を詰めるため、下段の末尾にも余分な空白が残らない。 */
  .my-hand.overlapping-cards .hand-row>.my-card:not(.character-card)+.my-card:not(.character-card){margin-left:-13px;z-index:calc(2 + var(--card-stack-index,0));}
  .my-hand.overlapping-cards .hand-row>.character-card+.my-card,.my-hand.overlapping-cards .hand-row>.character-card-slot+.my-card{margin-left:8px;}
  .my-card{
    --card-color:#9ca3af;--detail-color:var(--card-color);--panel-fill:#fffdf3;
    position:relative;width:82px;height:122px;border-radius:10px;
    border:4px solid var(--card-color);background-color:#fff;background-position:center;background-size:cover;
    box-sizing:border-box;overflow:hidden;color:#27231f;
    box-shadow:0 4px 12px rgba(0,0,0,.18),inset 0 0 0 2px rgba(0,0,0,.62);
  }
  @property --playable-card-scale{syntax:'<number>';inherits:true;initial-value:1;}
  .my-hand.has-playable-cards{animation:playableCardsPulse 1.05s ease-in-out infinite;}
  .my-card.playable{cursor:grab;touch-action:none;transform:scale(var(--playable-card-scale));}
  .my-card.drag-source{visibility:hidden;}
  @keyframes playableCardsPulse{50%{--playable-card-scale:1.07}}
  .drag-card{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.94;}
  .play-circle{position:absolute;width:64px;height:88px;border:0;border-radius:14px;transform:translate(-50%,-50%);display:grid;place-items:center;z-index:4;}
  .play-circle.drop-hint::before{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(125,211,252,.22);opacity:0;transition:opacity .15s;}
  .player-circle.dragging .play-circle.drop-hint::before{opacity:1;}
  .played-card-slot{position:relative;width:54px;height:81px;transform:rotate(var(--tilt));animation:cardArrive .35s ease-out both;}
  .played-card{position:absolute;left:0;top:0;transform:scale(.66);transform-origin:top left;}
  .played-card-slot.no-arrive{animation:none;}
  .played-card-slot.self-play{animation-name:cardArriveSelf;}
  @keyframes cardArrive{from{opacity:0;transform:translate(var(--from-x,0),var(--from-y,0)) scale(.25) rotate(var(--tilt))}to{opacity:1;transform:translate(0,0) scale(1) rotate(var(--tilt))}}
  @keyframes cardArriveSelf{from{opacity:.88;transform:translate(var(--from-x,0),var(--from-y,0)) scale(1.5) rotate(var(--tilt))}to{opacity:1;transform:translate(0,0) scale(1) rotate(var(--tilt))}}
  .played-card-slot.gathering{animation:gatherCard .7s ease-in-out both;}
  .played-card-slot.gathered{animation:none;transform:translate(var(--gather-x),var(--gather-y)) rotate(var(--tilt));}
  @keyframes gatherCard{from{transform:translate(0,0) rotate(var(--tilt))}to{transform:translate(var(--gather-x),var(--gather-y)) rotate(var(--tilt))}}
  .capture-circle{position:absolute;width:38px;height:56px;transform:translate(-50%,-50%);z-index:3;}
  .capture-trick{position:absolute;top:0;width:38px;height:56px;}
  .capture-card{position:absolute;inset:0;width:38px;height:56px;transform:rotate(var(--stack-rotate,-2deg));transform-origin:center;}
  .capture-card .my-card{transform:scale(.46);transform-origin:top left;}
  .capture-card.new-capture{animation:captureArrive .7s ease-in both;}
  @keyframes captureArrive{from{transform:translate(var(--capture-x),var(--capture-y)) scale(1.6) rotate(var(--stack-rotate,0deg))}to{transform:translate(0,0) rotate(var(--stack-rotate,0deg))}}
  .game-status{text-align:center;min-height:22px;font-size:13px;font-weight:800;color:#075985;margin-top:2px;}
  .stage-dialog{position:fixed;inset:0;z-index:320;display:grid;place-items:center;background:rgba(0,0,0,.38);}
  .stage-dialog.hidden{display:none;}
  .stage-panel{box-sizing:border-box;width:max-content;max-width:calc(100vw - 32px);padding:8px;border-radius:14px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;}
  .stage-grid{display:grid;grid-template-columns:repeat(4,36px);justify-content:center;gap:10px;}
  .stage-tab{width:36px;height:36px;padding:0;border:1px solid #111;border-radius:50%;background:#fff;font-size:12px;font-weight:800;cursor:pointer;}
  .stage-tab:hover,.stage-tab:focus-visible{background:#111;color:#fff;}
  .center-lower-card-area.hidden{display:none;}
  .center-lower-card-area{
    position:fixed;left:50%;top:calc(68% - 75px);transform:translate(-50%,-50%);
    width:calc(100vw - 32px);display:flex;align-items:center;justify-content:space-between;
    z-index:2;pointer-events:none;
  }
  .center-lower-card{
    position:relative;box-sizing:border-box;border:0;border-radius:10px;overflow:hidden;
    background-color:transparent;background-position:center;background-size:cover;background-repeat:no-repeat;flex:0 0 auto;
  }
  #arasujisquare{width:112px;height:160px;background-image:url('arasujisquare.jpg');}
  #winningconditionsquare{width:160px;height:112px;overflow:visible;background-image:url('winningconditionsquare.jpg');}
  .ringcircle{position:absolute;left:-51px;top:20px;width:56px;height:56px;box-sizing:border-box;border:1px solid #111;border-radius:50%;background:url('ringcircleoff.jpg') center/cover no-repeat;transform:translateY(-50%);}
  .ringcircle.on{background-image:url('ringcircleon.jpg');}
  .excluded-card-slot{position:absolute;left:-39px;top:50px;width:54px;height:81px;transform:rotate(var(--excluded-tilt,0deg));transform-origin:center;}
  .excluded-card-slot.hidden{display:none;}
  .excluded-card-slot>.my-card{transform:scale(.66);transform-origin:top left;}
  .excluded-card-slot.gandalf-pick{pointer-events:auto;cursor:pointer;animation:excludedCardPulse 1.05s ease-in-out infinite;}
  @keyframes excludedCardPulse{50%{transform:rotate(var(--excluded-tilt,0deg)) scale(1.12)}}
  .lost-card-flight{position:fixed;z-index:1001;pointer-events:none;width:82px;height:122px;transform-origin:top left;}
  .yellow-one-decision{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:310;width:min(230px,calc(100vw - 20px));padding:10px 6px 25px;box-sizing:border-box;border:1px solid #332a16;border-radius:13px;background:rgba(15,15,15,.97);color:#fff;box-shadow:0 18px 40px rgba(0,0,0,.42);text-align:center;}
  .yellow-one-decision.hidden{display:none;}
  .yellow-one-question{font-size:15px;font-weight:900;margin-bottom:8px;}
  .yellow-one-actions{display:flex;justify-content:center;gap:8px;}
  @property --hold-progress{syntax:'<number>';inherits:false;initial-value:0;}
  .hold-decision{position:relative;min-width:92px;overflow:hidden;user-select:none;touch-action:none;}
  .hold-decision[data-yellow-decision="yes"]{background:#d5a313;color:#111;border-color:#f1cf62;}
  .hold-decision[data-yellow-decision="no"]{background:#161616;color:#fff;border-color:#b99126;}
  .hold-decision::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.24);transform:scaleX(var(--hold-progress,0));transform-origin:left;z-index:0;}
  .hold-decision>span{position:relative;z-index:1;}
  .yellow-one-note{position:absolute;right:10px;bottom:6px;font-size:10px;font-weight:700;}
  .arasujisquare-bar,.arasujisquare-center,.winningcondition-half{position:absolute;box-sizing:border-box;border:0;background:transparent;}
  .arasujisquare-bar{left:13%;right:13%;top:calc(8% - 6px);height:16%;}
  .arasujisquare-center{left:50%;top:54%;width:95px;height:90px;transform:translate(-50%,-50%);}
  .winningcondition-half{top:50%;width:calc(42% - 1px);height:78%;transform:translateY(-50%);}
  .winningcondition-half.left{left:calc(8% + 1px);align-items:flex-start;}
  .winningcondition-half.right{right:calc(8% + 1px);}
  .arasujisquare-bar{display:grid;place-items:center;font-size:11px;font-weight:900;}
  .arasujisquare-center{display:flex;align-items:center;justify-content:center;padding:2px;overflow:hidden;font-size:9px;font-weight:400;line-height:1.05;}
  .winningcondition-half{display:flex;align-items:center;padding:2px;overflow:hidden;font-size:9px;line-height:1.25;text-align:left;}
  .winningcondition-content{width:100%;}
  .winningcondition-content strong{font-weight:900;}
  .stage-title,.character-heading,.character-line,.goal-heading{white-space:nowrap;}
  .stage-title{letter-spacing:normal;}
  .character-heading,.goal-heading{letter-spacing:-.08em;}
  .character-line{display:block;font-size:8px;letter-spacing:normal;}
  @media (max-width:520px){
    .center-lower-card-area{width:calc(100vw - 24px);}
  }
  .my-card.card-red{--card-color:#c94c47;}
  .my-card.card-green{--card-color:#559344;}
  .my-card.card-orange{--card-color:#d98236;}
  .my-card.card-yellow{--card-color:#d3ad32;}
  .my-card.card-gray{--card-color:#a9aca8;}
  .my-card.card-red{background-image:url('shadow.jpg');}
  .my-card.card-green{background-image:url('mori.jpg');}
  .my-card.card-orange{background-image:url('oka.jpg');}
  .my-card.card-yellow{background-image:url('yubiwa.jpg');}
  .my-card.card-gray{background-image:url('yama.jpg');}
  .card-badge{position:absolute;top:-4px;left:4px;width:22px;height:43px;background:var(--detail-color);clip-path:polygon(0 0,100% 0,100% 73%,50% 100%,0 73%);z-index:3;text-align:center;}
  .card-badge.right{left:auto;right:4px;}
  .card-badge::before{content:'';position:absolute;inset:2px;bottom:3px;background:var(--panel-fill);clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);z-index:-1;}
  .card-number{display:block;padding-top:2px;font:700 18px/19px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--card-color);}
  .card-mark{display:block;width:15px;height:15px;margin:0 auto;color:var(--card-color);}
  .card-mark svg{display:block;width:100%;height:100%;overflow:visible;}
  .card-name{position:absolute;left:7px;right:7px;bottom:4px;height:19px;background:var(--detail-color);clip-path:polygon(0 50%,10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%);font:700 12px/19px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;letter-spacing:.12em;z-index:3;}
  .card-name::before{content:'';position:absolute;inset:1px;background:var(--panel-fill);clip-path:polygon(0 50%,9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%);z-index:-1;}
  .card-name-initial{color:var(--card-color);font-weight:900;-webkit-text-stroke:.8px #111;paint-order:stroke fill;}
  .my-card.yellow-one .card-badge{background:var(--card-color);}
  .my-card.yellow-one .card-badge::before{background:#111;}
  .my-card.yellow-one .card-number{color:var(--card-color);}
  .my-card.yellow-one .card-mark{height:18px;margin-top:-1px;}
  .my-card.yellow-one .card-name{left:3px;right:3px;padding:0 7px;box-sizing:border-box;font-size:9px;letter-spacing:-.06em;white-space:nowrap;overflow:hidden;}
  .character-card{
    --character-frame:#73583a;--character-panel:#fff8e8;
    border-color:var(--character-frame);background-color:transparent;background-position:center;background-size:cover;background-repeat:no-repeat;
    box-shadow:0 4px 12px rgba(0,0,0,.18),inset 0 0 0 2px #fff9e9;
  }
  .character-card.character-gold{
    --character-frame:#d5a313;
    border-color:#d5a313;box-shadow:0 4px 12px rgba(91,63,0,.28),inset 0 0 0 2px #ffe477;
  }
  .character-card.character-silver{
    --character-frame:#aeb8c5;
    border-color:#aeb8c5;box-shadow:0 4px 12px rgba(40,51,65,.25),inset 0 0 0 2px #eef3f8;
  }
  .character-card .character-label{
    position:absolute;right:-4px;top:1px;width:max-content;min-width:0;max-width:64.8px;padding:2.7px 4.5px 2.7px 18px;
    box-sizing:border-box;background:var(--character-frame);color:#3f3021;font-size:9px;font-weight:900;isolation:isolate;
    line-height:1.1;text-align:right;white-space:nowrap;overflow:hidden;clip-path:polygon(6.3px 50%,16.2px 0,100% 0,100% 100%,16.2px 100%);
  }
  .character-card .character-label::before{
    content:'';position:absolute;inset:1px;background:var(--character-panel);z-index:-1;
    clip-path:polygon(6.3px 50%,16.2px 0,100% 0,100% 100%,16.2px 100%);
  }
  .character-card .character-special{top:17px;max-width:43px;padding:2.4px 4px 2.4px 18px;font-size:6px;line-height:1.2;}
  .character-card .character-effect{
    position:absolute;left:-4px;right:-4px;bottom:-4px;min-height:64px;padding:12px 5px 6px;
    box-sizing:border-box;background:var(--character-frame);isolation:isolate;
    display:flex;flex-direction:column;gap:2px;font-size:6px;line-height:1.2;text-align:left;
    clip-path:polygon(0 10px,30% 6px,70% 6px,100% 10px,100% 100%,0 100%);
  }
  .character-card .character-effect::before{
    content:'';position:absolute;inset:1px;background:var(--character-panel);z-index:-1;
    clip-path:polygon(0 10px,30% 6px,70% 6px,100% 10px,100% 100%,0 100%);
  }
  .character-effect-row{display:grid;grid-template-columns:6.6px 1fr;gap:.3px;align-items:start;}
  .character-effect-icon{display:block;width:6.48px;height:6.48px;color:#111;}
  .character-effect-icon svg{display:block;width:100%;height:100%;fill:currentColor;}
  .character-effect-row.victory .character-effect-icon{width:5.76px;height:5.76px;}
  .character-effect-row.special .character-effect-icon svg{fill:none;stroke:currentColor;stroke-width:.9;stroke-linejoin:round;}
  .character-effect-row.special .character-effect-icon path{fill:currentColor;stroke:none;}
  .card-zoom-backdrop{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.45);cursor:default;}
  .card-zoom-backdrop.hidden{display:none;}
  .card-zoom-frame{position:fixed;inset:0;pointer-events:none;}
  .card-zoom-item{position:absolute;width:var(--zoom-card-width);height:var(--zoom-card-height);transform:translate(-50%,-50%);}
  .card-zoom-card{position:relative;width:var(--zoom-card-width);height:var(--zoom-card-height);}
  .card-zoom-card>.my-card{position:absolute;left:0;top:0;width:var(--zoom-base-width);height:var(--zoom-base-height);transform:scale(var(--zoom-scale));transform-origin:top left;}
  .character-picker{position:fixed;inset:60px 0 0;z-index:315;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding-top:clamp(120px,calc(50vh - 160px),260px);box-sizing:border-box;pointer-events:none;}
  .character-picker.hidden{display:none;}
  .character-picker-title{margin:0;padding:7px 13px;border-radius:12px;background:#111;color:#fff;font-size:15px;font-weight:800;line-height:1;}
  .character-picker-row{width:calc(100vw - 24px);display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,14px);}
  .character-picker-row.two-rows{display:grid;grid-template-columns:repeat(var(--choice-columns),minmax(0,104px));justify-content:center;row-gap:clamp(8px,2vh,14px);}
  .character-choice{position:relative;flex:0 1 104px;width:min(104px,calc((100vw - 54px)/4));aspect-ratio:82/122;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;transition:transform .15s ease;}
  .character-picker-row.two-rows .character-choice{width:100%;}
  .character-choice:not(:disabled):hover{transform:translateY(-5px);}
  .character-choice.forced-unavailable{filter:brightness(.55) saturate(.7);}
  .character-choice.chosen-placeholder{visibility:hidden;pointer-events:none;}
  .character-picker.locked .character-choice{cursor:default;}
  .character-choice>.my-card{position:absolute;left:0;top:0;transform:scale(var(--choice-scale));transform-origin:top left;pointer-events:none;}
  .required-character-dot{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;box-sizing:border-box;border:2px solid #10233f;border-radius:50%;background:transparent url('definitechara.jpg') center/cover no-repeat;z-index:5;pointer-events:none;}
  .character-choice.required-raised{transform:translateY(-5px);}
  .character-choice.ring-required-pulse{animation:ringRequiredPulse 1.05s ease-in-out infinite;}
  @keyframes ringRequiredPulse{50%{transform:translateY(-7px) scale(1.06)}}
  .character-card-slot{position:relative;flex:0 0 82px;width:82px;height:122px;visibility:hidden;pointer-events:none;}
  @property --flight-scale{syntax:'<number>';inherits:true;initial-value:1;}
  .character-flight{position:fixed;z-index:1000;pointer-events:none;margin:0;will-change:left,top,width,height,opacity;}
  .character-flight>.my-card{position:absolute;left:0;top:0;transform:scale(var(--flight-scale));transform-origin:top left;}

    const fittedSize = Math.max(4, 9 * availableWidth / textWidth);

    };
    mark.innerHTML = markSvg[cardData.color] || '';
    badge.append(number, mark);
    return badge;
  };

  const name = document.createElement('span');
  name.className = 'card-name';
  if (isYellowOne) {
    name.textContent = 'このトリックに勝利してもよい';
  } else {
    const [initial = '', ...rest] = Array.from(cardData.name || '');
    const initialElement = document.createElement('strong');
    initialElement.className = 'card-name-initial';
    initialElement.textContent = initial;
    name.append(initialElement, rest.join(''));
  }
  if (isYellowOne) cardNameFitObserver.observe(name);

  // 左右とも数字とマークは同じ通常向きで表示する。
  card.append(createBadge('left'), createBadge('right'), name);
  return card;
}

function createCharacterCardElement(cardData){
  const card = document.createElement('div');
  card.className = 'my-card character-card zoomable-character';
  const isGoldCharacter = ['フロド', 'ビルボ'].includes(cardData.name);
  card.classList.add(isGoldCharacter ? 'character-gold' : 'character-silver');
  card.style.backgroundImage = `url("${encodeURIComponent(cardData.name)}.jpg")`;
  card.setAttribute('aria-label', `キャラクター ${cardData.name}`);
  card.setAttribute('role', 'button');
  card.tabIndex = 0;
  if (cardData.id) card.dataset.cardId = cardData.id;

  const name = document.createElement('span');
  name.className = 'character-label';
  name.textContent = cardData.name;
  fitCharacterName(name);
  const special = document.createElement('span');
  special.className = 'character-label character-special';
  appendWrappedCharacterName(special, cardData.specialName || '特殊名');
  const effect = document.createElement('div');
  effect.className = 'character-effect';
  const victory = cardData.victory || (cardData.name === 'フロド' ? '指輪を2枚以上獲得する。' : '');
  effect.append(
    createCharacterEffectRow('victory', victory),
    createCharacterEffectRow('special', cardData.effect || '特殊説明')
  );
  card.append(name, special, effect);
  card.addEventListener('click', event => {
    event.stopPropagation();
    openCardZoom(card);
  });
  card.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    event.stopPropagation();
    openCardZoom(card);
  });
  return card;
}

function positionZoomCards(){
  const scale = Number(cardZoomFrame.style.getPropertyValue('--zoom-scale')) || 1;
  const baseWidth = Number(cardZoomFrame.style.getPropertyValue('--zoom-base-width').replace('px', '')) || 82;
  const baseHeight = Number(cardZoomFrame.style.getPropertyValue('--zoom-base-height').replace('px', '')) || 122;
  const halfWidth = baseWidth * scale / 2;
  const halfHeight = baseHeight * scale / 2;
  cardZoomFrame.querySelectorAll('.card-zoom-item').forEach(item => {
    const playerId = item.dataset.playerId;
    const hand = playerId === state.userId
      ? myHandEl
      : playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(playerId)}"] .mini-hand`);
    const fallback = playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(playerId)}"]`);
    const rect = (hand || fallback)?.getBoundingClientRect();
    if (!rect) return;
    const x = Math.min(window.innerWidth - halfWidth - 8, Math.max(halfWidth + 8, rect.left + rect.width / 2));
    const y = Math.min(window.innerHeight - halfHeight - 8, Math.max(halfHeight + 8, rect.top + rect.height / 2));
    item.style.left = `${x}px`;
    item.style.top = `${y}px`;
  });
}

function openCardZoom(sourceCard){
  const playerCharacters = latestPlayers.map(player => ({
    player,
    card:state.hands[player.id]?.cards?.find(card => card?.kind === 'character')
  })).filter(item => item.card);
  if (!playerCharacters.length) return;

  // 各カードを、それぞれのプレイヤーの手札位置で控えめに拡大する。
  const scale = Math.min(1.5, Math.max(1.25, window.innerWidth / 380));
  // 表示中の元カードと同じ基準寸法からカード全体を拡大し、文字や各欄の比率を維持する。
  const baseWidth = sourceCard.offsetWidth || 82;
  const baseHeight = sourceCard.offsetHeight || 122;
  const items = playerCharacters.map(({ player, card }) => {
    const item = document.createElement('div');
    item.className = 'card-zoom-item';
    item.dataset.playerId = player.id;
    const cardHolder = document.createElement('div');
    cardHolder.className = 'card-zoom-card';
    const enlargedCard = createCharacterCardElement(card);
    enlargedCard.classList.remove('zoomable-character');
    enlargedCard.removeAttribute('role');
    enlargedCard.removeAttribute('tabindex');
    cardHolder.appendChild(enlargedCard);
    item.appendChild(cardHolder);
    return item;
  });
  cardZoomFrame.replaceChildren(...items);
  cardZoomFrame.style.setProperty('--zoom-base-width', `${baseWidth}px`);
  cardZoomFrame.style.setProperty('--zoom-base-height', `${baseHeight}px`);
  cardZoomFrame.style.setProperty('--zoom-card-width', `${baseWidth * scale}px`);
  cardZoomFrame.style.setProperty('--zoom-card-height', `${baseHeight * scale}px`);
  cardZoomFrame.style.setProperty('--zoom-scale', scale);
  cardZoomBackdrop.classList.remove('hidden');
  cardZoomBackdrop.setAttribute('aria-hidden', 'false');
  positionZoomCards();
}

function closeCardZoom(){
  cardZoomBackdrop.classList.add('hidden');
  cardZoomBackdrop.setAttribute('aria-hidden', 'true');
  cardZoomFrame.replaceChildren();
}

cardZoomBackdrop.addEventListener('click', closeCardZoom);
window.addEventListener('resize', () => {

function createCharacterEffectRow(type, text){
  const row = document.createElement('div');

    : '<svg viewBox="0 0 20 20" aria-hidden="true"><g transform="rotate(35 10 10)"><rect x="7" y="7" width="2" height="11"/><path d="M3 3Q10 3.5 17 6Q10 8.5 3 9Q5 6 3 3Z"/></g></svg>';

// 3文字までは一行、それ以上も読みやすい位置で分け、必ず二行以内にする。
function appendWrappedCharacterName(element, value){
  const characters = Array.from(value);
  if (characters.length <= 3) {
    element.textContent = value;
    return;
  }
  const firstLineLength = Math.ceil(characters.length / 2);
  element.append(
    document.createTextNode(characters.slice(0, firstLineLength).join('')),
    document.createElement('br'),
    document.createTextNode(characters.slice(firstLineLength).join(''))
  );
}

function fitSingleLineText(element, maxSize, minSize = 4){
  element.style.fontSize = `${maxSize}px`;
  const availableWidth = element.clientWidth || element.parentElement?.clientWidth || 0;
  if (!availableWidth || !element.textContent) return;
  const range = document.createRange();
  range.selectNodeContents(element);
  const textWidth = range.getBoundingClientRect().width;
  if (textWidth > availableWidth) {
    element.style.fontSize = `${Math.max(minSize, maxSize * availableWidth / textWidth)}px`;
  }
}

async function takeExcludedCardAsGandalf(){
  if (!state.roomCode || state.game?.phase !== 'gandalf-selection' || state.game?.gandalfPlayerId !== state.userId) return;
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    const game = room?.game;
    if (!game?.excludedCard || game.phase !== 'gandalf-selection' || game.gandalfPlayerId !== state.userId) return;
    room.hands ||= {};
    room.hands[state.userId] ||= { cards:[] };
    room.hands[state.userId].cards ||= [];
    room.hands[state.userId].cards.push(game.excludedCard);
    game.lostCardTransfer = { cardId:game.excludedCard.id, playerId:state.userId, movedAt:Date.now() };
    delete game.excludedCard;
    game.phase = 'playing';
    game.turnPlayerId = game.startingPlayerId || game.playerOrder?.[0] || null;
    delete game.startingPlayerId;
    return room;
  });
}

excludedCardSlot.addEventListener('click', takeExcludedCardAsGandalf);

function animateLostCard(sourceRect, transfer){
  if (!sourceRect || !transfer?.cardId) return;
  const target = transfer.playerId === state.userId
    ? myHandEl.querySelector(`[data-card-id="${CSS.escape(transfer.cardId)}"]`)
    : playerCircle.querySelector(`.player-tag[data-player-id="${CSS.escape(transfer.playerId)}"] .mini-card:last-child`);
  const targetRect = target?.getBoundingClientRect();
  const cardData = state.hands?.[transfer.playerId]?.cards?.find(card => card.id === transfer.cardId);
  if (!targetRect || !cardData) return;
  const flight = createCardElement(cardData);
  flight.classList.add('lost-card-flight');
  flight.style.left = `${sourceRect.left}px`;
  flight.style.top = `${sourceRect.top}px`;
  flight.style.transform = `scale(${sourceRect.width / 82})`;
  document.body.appendChild(flight);
  flight.animate([
    { left:`${sourceRect.left}px`, top:`${sourceRect.top}px`, transform:`scale(${sourceRect.width / 82})`, opacity:1 },
    { left:`${targetRect.left}px`, top:`${targetRect.top}px`, transform:`scale(${targetRect.width / 82})`, opacity:1 }
  ], { duration:800, easing:'cubic-bezier(.22,.8,.25,1)', fill:'forwards' }).finished.finally(() => {
    flight.remove();
    target.style.removeProperty('opacity');
  });
  // 到着までは追加カード本体を隠し、同じカードが二重に見えないようにする。
  target.style.opacity = '0';
}

function captureMyHandRects(){
  return new Map(Array.from(myHandEl.querySelectorAll('[data-card-id]'), card => [
    card.dataset.cardId, card.getBoundingClientRect()
  ]));
}

function animateMyHandReflow(previousRects){
  myHandEl.querySelectorAll('[data-card-id]').forEach(card => {
    const previous = previousRects.get(card.dataset.cardId);
    if (!previous) return;
    const current = card.getBoundingClientRect();
    const x = previous.left - current.left;
    const y = previous.top - current.top;
    if (Math.abs(x) < 1 && Math.abs(y) < 1) return;
    // 除外カード追加で既存カードの並びが変わっても、旧位置から滑らかに詰め直す。
    card.animate([
      { transform:`translate(${x}px,${y}px)` },
      { transform:'translate(0,0)' }
    ], { duration:500, easing:'cubic-bezier(.22,.8,.25,1)' });
  });
}

function subscribeRoom(){
  const roomRef = ref(db, `rooms/${state.roomCode}`);
  onValue(roomRef, snap => {
    const previousTransferAt = state.game?.lostCardTransfer?.movedAt;
    const excludedSourceRect = state.game?.excludedCard ? excludedCardSlot.getBoundingClientRect() : null;
    const previousMyHandRects = captureMyHandRects();
    state.room = snap.val() || {};
    state.game = state.room.game || null;
    state.hands = state.room.hands || {};
    const waiting = (!state.isHost && !state.room.maxPlayers);
    hostSelectingPop.classList.toggle('hidden', !waiting);
    renderHands();
    renderStageInformation();
    renderYellowOneDecision();
    const transfer = state.game?.lostCardTransfer;
    if (transfer?.movedAt && transfer.movedAt !== previousTransferAt && excludedSourceRect) {
      requestAnimationFrame(() => {
        animateMyHandReflow(previousMyHandRects);
        animateLostCard(excludedSourceRect, transfer);
      });
    }
    scheduleTrickClear();
    syncSeatUI();
  });
}

function renderYellowOneDecision(){

  yellowOneDecision.classList.toggle('hidden', !visible);
}

async function decideYellowOne(wins){
  if (!state.roomCode) return;
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    const pending = room?.game?.pendingYellowOneDecision;
    if (!pending || pending.playerId !== state.userId) return;
    const winnerId = wins ? pending.playerId : pending.normalWinnerId;
    room.game.lastWinnerId = winnerId;
    room.game.tricksWon ||= {};
    room.game.tricksWon[winnerId] = (room.game.tricksWon[winnerId] || 0) + 1;
    const gatherAt = Date.now() + 250;
    room.game.pendingCapture = {
      winnerId, cards:pending.cards,
      winningCardId:wins ? pending.yellowOneCardId : pending.normalWinningCardId,
      gatherAt, captureAt:gatherAt + 700
    };
    room.game.turnPlayerId = winnerId;
    room.game.trickNumber = (room.game.trickNumber || 1) + 1;
    if ((room.game.playerOrder || []).every(id => !(room.hands?.[id]?.cards || []).some(card => card.kind !== 'character'))) room.game.finished = true;
    delete room.game.pendingYellowOneDecision;
    return room;
  });
}

yellowOneDecision.querySelectorAll('.hold-decision').forEach(button => {
  let timer = null;
  let animation = null;
  const cancel = () => {
    clearTimeout(timer); timer = null;
    animation?.cancel(); animation = null;
    button.style.setProperty('--hold-progress', 0);
  };
  button.addEventListener('click', event => event.preventDefault());
  button.addEventListener('pointerdown', event => {
    if (event.button !== undefined && event.button !== 0) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    animation = button.animate([{ '--hold-progress':'0' }, { '--hold-progress':'1' }], { duration:2000, fill:'forwards' });
    timer = setTimeout(() => { cancel(); decideYellowOne(button.dataset.yellowDecision === 'yes'); }, 2000);
  });
  button.addEventListener('pointerup', cancel);
  button.addEventListener('pointercancel', cancel);
  button.addEventListener('lostpointercapture', cancel);
});

function scheduleTrickClear(){
  clearTimeout(trickClearTimer);
  const gatherAt = state.game?.pendingCapture?.gatherAt;
  const captureAt = state.game?.pendingCapture?.captureAt;
  if (!captureAt || !state.roomCode) return;
  if (gatherAt && Date.now() < gatherAt) {
    trickClearTimer = setTimeout(() => {
      renderHands();
      scheduleTrickClear();
    }, Math.max(0, gatherAt - Date.now()) + 20);
    return;
  }
  trickClearTimer = setTimeout(async () => {
    await runTransaction(ref(db, `rooms/${state.roomCode}/game`), game => {
      const pending = game?.pendingCapture;
      if (!pending || pending.captureAt !== captureAt || Date.now() < captureAt) return;
      game.capturedCards ||= {};
      game.capturedCards[pending.winnerId] ||= [];
      game.capturedCards[pending.winnerId].push(...pending.cards);
      game.capturedTricks ||= {};
      game.capturedTricks[pending.winnerId] ||= [];
      game.capturedTricks[pending.winnerId].push({
        cards: pending.cards,
        winningCardId: pending.winningCardId
      });
      delete game.trick;
      delete game.pendingCapture;
      return game;
    });
  }, Math.max(0, captureAt - Date.now()) + 20);
}
function subscribeHostState(){

function renderMyHand(){
  myHandEl.innerHTML = '';
  myHandEl.classList.remove('has-playable-cards', 'overlapping-cards');
  myHandEl.style.removeProperty('--hand-columns');
  const myId = state.userId;
  const handData = state.hands[myId];
  if (!handData || !Array.isArray(handData.cards)) return;

  const character = handData.cards.find(card => card?.kind === 'character');
  const characterIsWaiting = Boolean(character) && Date.now() < (characterAnimationUntil.get(myId) || 0);
  // 選択開始時からキャラクター用の先頭枠を確保し、選択・到着時に数字カードを動かさない。
  const reserveCharacterSlot = state.game?.phase === 'character-selection' || characterIsWaiting;
  const cardCount = handData.cards.length + (!character && reserveCharacterSlot ? 1 : 0);
  const numberCardCount = handData.cards.filter(card => card?.kind !== 'character').length;
  myHandEl.classList.toggle('overlapping-cards', numberCardCount >= 6);
  // 数字カードが7枚以上なら、1段目を「キャラクター+数字6枚」に固定して残りを2段目へ送る。
  const columnCount = numberCardCount >= 7 ? 7 : Math.max(cardCount, 1);
  myHandEl.style.setProperty('--hand-columns', columnCount);
  const upperRow = document.createElement('div');
  upperRow.className = 'hand-row hand-row-upper';
  const lowerRow = document.createElement('div');
  lowerRow.className = 'hand-row hand-row-lower';
  myHandEl.append(upperRow, lowerRow);

  let hasPlayableCards = false;
  const colorOrder = { red: 0, green: 1, orange: 2, gray: 3, yellow: 4 };
  const displayedCards = handData.cards.map((cardData, cardIndex) => ({
    // 古いルームに残っている数字カードも表示を壊さない。
    normalized: (typeof cardData === 'object' && cardData)
      ? cardData
      : { color: 'gray', name: '山', number: cardData },
    cardIndex
  })).filter(({ normalized }) => normalized.kind !== 'character' || !characterIsWaiting).sort((left, right) => {
    if (left.normalized.kind === 'character') return right.normalized.kind === 'character' ? 0 : -1;
    if (right.normalized.kind === 'character') return 1;
    const typeDifference = (colorOrder[left.normalized.color] ?? 3) - (colorOrder[right.normalized.color] ?? 3);
    return typeDifference || (Number(left.normalized.number) || 0) - (Number(right.normalized.number) || 0);
  });

  if (reserveCharacterSlot && (!character || characterIsWaiting)) {
    const characterSlot = document.createElement('div');
    characterSlot.className = 'character-card-slot';
    characterSlot.setAttribute('aria-hidden', 'true');
    upperRow.appendChild(characterSlot);
  }

  let displayedNumberIndex = 0;
  displayedCards.forEach(({ normalized, cardIndex }) => {
    const card = createCardElement(normalized);
    if (normalized.kind !== 'character') {
      card.style.setProperty('--card-stack-index', displayedNumberIndex);
      displayedNumberIndex += 1;
    }
    const canPlay = normalized.kind !== 'character' && state.game?.phase === 'playing'
      && !state.game.pendingCapture && !state.game.pendingYellowOneDecision
      && state.game.turnPlayerId === myId && canFollowSuit(normalized);
    if (canPlay) {
      hasPlayableCards = true;
      card.classList.add('playable');
      card.addEventListener('pointerdown', event => beginCardDrag(event, normalized, cardIndex, card));
    }
    const cardRow = normalized.kind === 'character' || displayedNumberIndex <= 6 ? upperRow : lowerRow;
    cardRow.appendChild(card);
  });
  myHandEl.classList.toggle('has-playable-cards', hasPlayableCards);
}

function canFollowSuit(card){
  const trick = state.game?.trick || {};
  const plays = Object.values(trick);
  if (!plays.length) return card.color !== 'yellow' || state.game?.ringCircleOn === true;
  const leadColor = plays.sort((a,b) => a.order-b.order)[0].card.color;
  const cards = (state.hands[state.userId]?.cards || []).filter(card => card.kind !== 'character');
  return card.color === leadColor || !cards.some(c => c.color === leadColor);
}

let selfDropPoint = null;

function beginCardDrag(event, cardData, cardIndex, source){
  if (event.button !== undefined && event.button !== 0) return;
  event.preventDefault();
  source.setPointerCapture(event.pointerId);
  source.classList.add('drag-source');
  playerCircle.classList.add('dragging');
  const floating = createCardElement(cardData);
  floating.classList.add('drag-card');
  document.body.appendChild(floating);
  const move = e => { floating.style.left = `${e.clientX}px`; floating.style.top = `${e.clientY}px`; };
  move(event);
  const finish = async e => {
    source.removeEventListener('pointermove', move);
    source.removeEventListener('pointerup', finish);
    source.removeEventListener('pointercancel', cancel);
    floating.remove(); source.classList.remove('drag-source'); playerCircle.classList.remove('dragging');
    const target = playerCircle.querySelector('.play-circle.mine');
    const rect = target?.getBoundingClientRect();
    if (rect && e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      selfDropPoint = { x: e.clientX, y: e.clientY };
      await playCard(cardIndex, cardData);
    }
  };
  const cancel = () => { floating.remove(); source.classList.remove('drag-source'); playerCircle.classList.remove('dragging'); };
  source.addEventListener('pointermove', move);
  source.addEventListener('pointerup', finish, { once:true });
  source.addEventListener('pointercancel', cancel, { once:true });
}

async function playCard(cardIndex, expectedCard){
  if (!state.roomCode) return;
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    if (!room?.game || room.game.phase !== 'playing' || room.game.pendingCapture
      || room.game.pendingYellowOneDecision || room.game.turnPlayerId !== state.userId) return;
    const hand = room.hands?.[state.userId]?.cards;
    const card = hand?.[cardIndex];
    if (!card || card.kind === 'character' || card.id !== expectedCard.id) return;
    const existing = Object.values(room.game.trick || {}).sort((a,b)=>a.order-b.order);
    if (!existing.length && card.color === 'yellow' && room.game.ringCircleOn !== true) return;
    if (existing.length) {
      const lead = existing[0].card.color;
      if (card.color !== lead && hand.some(c => c.color === lead)) return;
    }
    hand.splice(cardIndex, 1);
    room.hands[state.userId].cards = hand;
    if (card.color === 'yellow') room.game.ringCircleOn = true;
    room.game.trick ||= {};
    room.game.trick[state.userId] = { card, order: existing.length, tilt: Math.floor(Math.random()*5)-2 };
    const order = room.game.playerOrder;
    // 配り切りで手札枚数に1枚差がある場合、カードが残っているプレイヤーだけで最後のトリックを行う。
    const trickPlayers = order.filter(id => room.game.trick[id]
      || (room.hands[id]?.cards || []).some(handCard => handCard.kind !== 'character'));
    if (existing.length + 1 === trickPlayers.length) {
      const plays = [...existing, room.game.trick[state.userId]];
      const lead = plays[0].card.color;
      const winnerPlay = plays.filter(p=>p.card.color===lead).reduce((best,p)=>p.card.number>best.card.number?p:best);
      const winnerId = Object.entries(room.game.trick).find(([,p])=>p===winnerPlay)?.[0] || state.userId;
      const yellowOneEntry = Object.entries(room.game.trick)
        .find(([, play]) => play.card.color === 'yellow' && play.card.number === 1);
      if (yellowOneEntry) {
        // 黄1所持者が決めるまで、場札はそのままにして回収を保留する。
        room.game.pendingYellowOneDecision = {
          playerId:yellowOneEntry[0], normalWinnerId:winnerId,
          cards:plays.map(p => p.card), normalWinningCardId:winnerPlay.card.id,
          yellowOneCardId:yellowOneEntry[1].card.id, requestedAt:Date.now()
        };
        room.game.turnPlayerId = null;
      } else {
        room.game.lastWinnerId = winnerId;
        room.game.tricksWon ||= {};
        room.game.tricksWon[winnerId] = (room.game.tricksWon[winnerId] || 0) + 1;
        const gatherAt = Date.now() + 2000;
        room.game.pendingCapture = {
          winnerId, cards:plays.map(p => p.card), winningCardId:winnerPlay.card.id,
          gatherAt, captureAt:gatherAt + 700
        };
        room.game.turnPlayerId = winnerId;
        room.game.trickNumber = (room.game.trickNumber || 1) + 1;
        if (order.every(id => !(room.hands[id]?.cards || []).some(card => card.kind !== 'character'))) room.game.finished = true;
      }
    } else {
      const currentIndex = order.indexOf(state.userId);
      room.game.turnPlayerId = Array.from({ length: order.length - 1 }, (_, offset) => order[(currentIndex + offset + 1) % order.length])
        .find(id => !room.game.trick[id] && (room.hands[id]?.cards || []).some(handCard => handCard.kind !== 'character'));
    }
    return room;
  });
}

function characterCardData(character, playerId){
  const characterDetails = {
    'フロド': {
      specialName:'指輪所持者',
      victory:'指輪を2枚以上獲得する。',
      effect:'黄1を所持している。黄1は交換できない。スタートプレイヤーになる。'
    },
    'ピピン': {
      specialName:'愚か者',
      victory:'トリック獲得数が最少（最少同数でもよい）。',
      effect:'フロド/サム/メリーの誰かと交換する。'
    },
    'ガンダルフ': {
      specialName:'灰色の魔法使い',
      victory:'1トリック以上獲得。',
      effect:'手札にロストカードを加える。フロドと交換する。'
    },
    'ビルボ': {
      specialName:'変人',
      victory:'3トリック以上獲得。',
      effect:'無し'
    }
  };
  const details = characterDetails[character.name] || {};
  return {
    kind:'character', name:character.name, required:character.required === true,
    specialName:details.specialName || '特殊名',
    victory:details.victory || '',
    effect:details.effect || '特殊説明',
    id:`${playerId}-character-${character.name}`
  };
}

function animateCharacterSelection(playerId, character, sourceRect){
  const isMe = playerId === state.userId;
  // 自分は手札の先頭枠、他プレイヤーは公開キャラクター専用の獲得カード枠を着地点にする。
  const target = isMe
    ? (myHandEl.querySelector('.character-card,.character-card-slot') || myHandEl)
    : playerCircle.querySelector(`.capture-circle[data-player-id="${CSS.escape(playerId)}"]`);
  const targetRect = target?.getBoundingClientRect();
  if (!sourceRect || !targetRect) return;
  const flight = document.createElement('div');
  flight.className = 'character-flight';
  flight.style.left = `${sourceRect.left}px`;
  flight.style.top = `${sourceRect.top}px`;
  flight.style.width = `${sourceRect.width}px`;
  flight.style.height = `${sourceRect.height}px`;
  const flightCard = createCharacterCardElement(characterCardData(character, playerId));
  flight.appendChild(flightCard);
  document.body.appendChild(flight);
  const baseWidth = flightCard.offsetWidth || 82;
  const destinationWidth = isMe ? targetRect.width : 38;
  const destinationHeight = isMe ? targetRect.height : 56;
  const destinationLeft = targetRect.left;
  const destinationTop = targetRect.top;
  flight.style.setProperty('--flight-scale', sourceRect.width / baseWidth);
  const animation = flight.animate([
    { left:`${sourceRect.left}px`, top:`${sourceRect.top}px`, width:`${sourceRect.width}px`, height:`${sourceRect.height}px`, opacity:1 },
    { left:`${destinationLeft}px`, top:`${destinationTop}px`, width:`${destinationWidth}px`, height:`${destinationHeight}px`, opacity:1 }
  ], { duration:650, easing:'cubic-bezier(.22,.8,.25,1)', fill:'forwards' });
  flight.animate([
    { '--flight-scale':String(sourceRect.width / baseWidth) },
    { '--flight-scale':String(destinationWidth / baseWidth) }
  ], { duration:650, easing:'cubic-bezier(.22,.8,.25,1)', fill:'forwards' });
  characterAnimationUntil.set(playerId, Date.now() + 650);
  animation.finished.finally(() => {
    flight.remove();
    characterAnimationUntil.delete(playerId);
    renderMyHand();
    if (latestPlayers.length) renderPlayerCircle(latestPlayers);
  });
}

async function chooseCharacter(characterName, source){
  if (!state.roomCode || state.game?.phase !== 'character-selection') return;
  characterSelectionSources.set(characterName, source.getBoundingClientRect());
  await runTransaction(ref(db, `rooms/${state.roomCode}`), room => {
    if (!room?.game || room.game.phase !== 'character-selection') return;
    room.game.characterSelections ||= {};
    if (room.game.characterSelections[state.userId]) return;
    const character = (room.game.availableCharacters || []).find(item => item.name === characterName);
    if (!character || Object.values(room.game.characterSelections).some(item => item.name === characterName)) return;
    const hasYellowOne = (room.hands?.[state.userId]?.cards || [])
      .some(card => card.color === 'yellow' && card.number === 1);
    // 黄1の所持者は必ずフロドを、所持していないプレイヤーはフロド以外を選ぶ。
    if ((characterName === 'フロド') !== hasYellowOne) return;
    const selectedNames = new Set(Object.values(room.game.characterSelections).map(item => item.name));
    const remainingRequiredCount = (room.game.availableCharacters || [])
      .filter(item => item.required && !selectedNames.has(item.name)).length;
    const remainingPlayerCount = (room.game.playerOrder || []).length - Object.keys(room.game.characterSelections).length;
    // 残り人数と必須カード数が同じなら、任意カードを選んで必須カードを残すことはできない。
    if (remainingRequiredCount >= remainingPlayerCount && !character.required) return;
    room.hands ||= {};
    room.hands[state.userId] ||= { cards:[] };
    room.hands[state.userId].cards ||= [];
    room.hands[state.userId].cards.unshift(characterCardData(character, state.userId));
    room.game.characterSelections[state.userId] = { ...character, selectedAt:Date.now() };
    if (characterName === 'フロド') {
      const currentHolder = Object.keys(room.hands).find(id => room.hands[id].cards.some(card => card.color === 'yellow' && card.number === 1));
      if (currentHolder && currentHolder !== state.userId) {
        const yellowIndex = room.hands[currentHolder].cards.findIndex(card => card.color === 'yellow' && card.number === 1);
        const replacementIndex = room.hands[state.userId].cards.findIndex(card => card.kind !== 'character');
        const replacement = room.hands[state.userId].cards[replacementIndex];
        room.hands[state.userId].cards[replacementIndex] = room.hands[currentHolder].cards[yellowIndex];
        room.hands[currentHolder].cards[yellowIndex] = replacement;
      }
      room.game.turnPlayerId = state.userId;
    }
    const chosenCount = Object.keys(room.game.characterSelections).length;
    if (chosenCount >= room.game.playerOrder.length) {
      const gandalfEntry = Object.entries(room.game.characterSelections)
        .find(([, selected]) => selected.name === 'ガンダルフ');
      if (gandalfEntry && room.game.excludedCard) {
        // ガンダルフがロストカードを取るまでは、全プレイヤーのカードプレイを止める。
        room.game.phase = 'gandalf-selection';
        room.game.gandalfPlayerId = gandalfEntry[0];
        // フロド等によって既に決まったスタートプレイヤーを、取得完了後まで保持する。
        room.game.startingPlayerId = room.game.turnPlayerId || room.game.playerOrder[0];
        room.game.turnPlayerId = null;
      } else {
        room.game.phase = 'playing';
        room.game.turnPlayerId ||= room.game.playerOrder[0];
      }
    }
    return room;
  });
}

function renderCharacterPicker(){
  const game = state.game;
  const selections = game?.characterSelections || {};
  const oldRects = new Map();
  characterPickerRow.querySelectorAll('.character-choice').forEach(choice => oldRects.set(choice.dataset.characterName, choice.getBoundingClientRect()));
  Object.entries(selections).forEach(([playerId, character]) => {
    const key = `${game.startedAt || game.stageNumber}:${playerId}:${character.name}`;
    if (seenCharacterSelections.has(key)) return;
    seenCharacterSelections.add(key);
    const sourceRect = characterSelectionSources.get(character.name) || oldRects.get(character.name);
    if (sourceRect) {
      characterAnimationUntil.set(playerId, Date.now() + 650);
      requestAnimationFrame(() => animateCharacterSelection(playerId, character, sourceRect));
    }
  });
  const alreadyChose = Boolean(selections[state.userId]);
  // 選択済みの本人にも、全員の選択が終わるまでは残りの候補を表示し続ける。
  characterPicker.classList.toggle('hidden', game?.phase !== 'character-selection');
  characterPicker.classList.toggle('locked', alreadyChose);
  characterPickerRow.classList.remove('two-rows');
  characterPickerRow.style.removeProperty('--choice-columns');
  characterPickerRow.replaceChildren();
  if (game?.phase !== 'character-selection') return;
  const chosenNames = new Set(Object.values(selections).map(item => item.name));
  const allCharacters = game.availableCharacters || [];
  const remainingCharacters = allCharacters.filter(character => !chosenNames.has(character.name));
  const remainingRequiredCount = remainingCharacters.filter(character => character.required).length;
  const remainingPlayerCount = (game.playerOrder || []).length - Object.keys(selections).length;
  const mustChooseRequired = remainingRequiredCount > 0 && remainingRequiredCount >= remainingPlayerCount;
  const hasYellowOne = (state.hands?.[state.userId]?.cards || [])
    .some(card => card.color === 'yellow' && card.number === 1);
  if (allCharacters.length >= 5) {
    characterPickerRow.classList.add('two-rows');
    characterPickerRow.style.setProperty('--choice-columns', Math.ceil(allCharacters.length / 2));
  }
  // 選択済みカードも不可視の枠として残し、誰かが取っても残りのカードを動かさない。
  allCharacters.forEach(character => {
    const choice = document.createElement('button');
    choice.type = 'button';
    choice.className = 'character-choice';
    const isChosen = chosenNames.has(character.name);
    choice.classList.toggle('chosen-placeholder', isChosen);
    const violatesRingRule = character.name === 'フロド' ? !hasYellowOne : hasYellowOne;
    const unavailable = violatesRingRule || (mustChooseRequired && !character.required);
    choice.disabled = isChosen || alreadyChose || unavailable;
    // 選択できない場合も、フロドは暗くせず黄1との対応を見分けやすくする。
    choice.classList.toggle('forced-unavailable', unavailable && !hasYellowOne && character.name !== 'フロド');
    choice.dataset.characterName = character.name;
    choice.classList.toggle('ring-required-pulse', hasYellowOne && character.name === 'フロド');
    const choiceCard = createCharacterCardElement(characterCardData(character, state.userId));
    choice.appendChild(choiceCard);
    if (character.required) {
      // 必須マークはカード内部ではなく、選択肢の右下に独立した要素として重ねる。
      const requiredDot = document.createElement('span');
      requiredDot.className = 'required-character-dot';
      requiredDot.setAttribute('aria-label', '必須キャラクター');
      choice.appendChild(requiredDot);
      // 黄1所持者には、選択可能なフロドだけを従来どおり浮かせる。
      choice.classList.toggle('required-raised', hasYellowOne ? character.name === 'フロド' : mustChooseRequired);
    }
    choice.addEventListener('click', event => { event.stopPropagation(); chooseCharacter(character.name, choice); });
    characterPickerRow.appendChild(choice);
    choice.style.setProperty('--choice-scale', choice.getBoundingClientRect().width / (choiceCard.offsetWidth || 82));
  });
}

async function createUniqueRoom(name){
  while (true) {
    const code = generateRoomCode();
    const createdAt = Date.now();
    const result = await runTransaction(ref(db, `rooms/${code}`), current => current === null ? {
      createdAt,
      hostId: state.userId,
      users: { [state.userId]: { name, joinedAt: createdAt } }
    } : undefined);
    if (result.committed) return code;
  }
}
onValue(ref(db, 'rooms'), snapshot => {
  entranceRooms = Object.entries(snapshot.val() || {}).map(([code, room]) => {
    const people = room.players || room.users || {};
    const entries = Object.entries(people).filter(([, person]) => String(person?.name || '').trim());
    entries.sort(([a],[b]) => (a === room.hostId ? -1 : b === room.hostId ? 1 : 0));
    return { code, createdAt: room.createdAt || 0, names: entries.map(([, person]) => person.name) };
  }).sort((a,b) => b.createdAt - a.createdAt);
  entranceLoading.classList.add('hidden');
  renderEntranceRooms();
}, () => {
  entranceLoading.classList.add('hidden');
});

async function enterRoom(roomCode, userName){
  state.userName = userName;
  state.roomCode = roomCode;

  await set(ref(db, `rooms/${state.roomCode}/users/${state.userId}`), {
    name: state.userName,
    joinedAt: Date.now()
  });

  const roomRef = ref(db, `rooms/${state.roomCode}`);
  const roomSnap = await get(roomRef);
  const roomData = roomSnap.val();

  if(!roomData || !roomData.hostId){
    await update(roomRef, { hostId: state.userId });
    state.isHost = true;
  } else {
    state.isHost = (roomData.hostId === state.userId);
  }

  updateHostUI();

  mainEl.classList.remove('prejoin');
  mainEl.classList.add('joined');

  document.body.classList.remove('entrance-screen');
  joinBox.classList.add('hidden');
  lobby.classList.remove('hidden');
  lobby.classList.add('entered');

  await restoreSeatFromDB();

  subscribeRoom();
  subscribeHostState();
  subscribePlayers();

  syncSeatUI();
}

        tab.textContent = i;

        tab.onclick = async () => {
          await update(roomRef, { maxPlayers: i });
          const tRef = ref(db, `rooms/${state.roomCode}/tables/1`);
          await set(tRef, { playerId: state.userId, playerName: state.userName });

          state.seatedTable = 1;
          seatPop.classList.add('hidden');
        };
        seatTabs.appendChild(tab);
      }
      return;
    }

    seatLabel.textContent = '席を選択';

    const effectiveMax = maxPlayers || 8;
    const tablesSnap = await get(ref(db, `rooms/${state.roomCode}/tables`));
    const tables = tablesSnap.val() || {};

    for(let i=1; i<=effectiveMax; i++){
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.textContent = i;

      const t = tables[i];
      if(t && t.playerId) tab.classList.add('disabled');

      tab.onclick = async () => {
        if(tab.classList.contains('disabled')) return;
        const tRef = ref(db, `rooms/${state.roomCode}/tables/${i}`);
        await set(tRef, { playerId: state.userId, playerName: state.userName });
        state.seatedTable = i;
        seatPop.classList.add('hidden');
      };
      seatTabs.appendChild(tab);
    }
  } finally {
    isRenderingSeatTabs = false;
  }
}

btnSeatCancel.onclick = () => {
  seatPop.classList.add('hidden');
  state.seatedTable = null;
};

function subscribePlayers(){
  const tablesRef = ref(db, `rooms/${state.roomCode}/tables`);
  onValue(tablesRef, async snap => {
    const data = snap.val() || {};
    const players = Object.entries(data)
      .map(([seatIndex, t]) => (t && t.playerId ? {
        id: t.playerId,
        name: t.playerName || '名無し',
        seatIndex: Number(seatIndex)
      } : null))
      .filter(Boolean)
      .sort((a,b) => a.seatIndex - b.seatIndex);

    latestPlayers = players;

    const mySeat = players.find(p => p.id === state.userId);
    if (mySeat && state.seatedTable === null) {
      state.seatedTable = mySeat.seatIndex;
      seatPop.classList.add('hidden');
    }

    const meStillSeated = players.some(p => p.id === state.userId);
    if (!meStillSeated && state.seatedTable !== null) {
      state.seatedTable = null;
    }

    await syncSeatUI();
    renderPlayerCircle(players);
  });
}

function renderPlayerCircle(players){
  playerCircle.innerHTML = '';
  if (!players.length) return;

  const n = players.length;
  const radius = 45;
  const step = (2 * Math.PI) / n;
  const anchorAngle = Math.PI / 2;
  const meIndex = players.findIndex(p => p.id === state.userId);
  const geometryFor = (player, idx) => {
    const k = (meIndex === -1) ? idx : (idx - meIndex + n) % n;
    const angle = anchorAngle + step * k;
    const isMe = player.id === state.userId;
    const isTopPlayer = Math.sin(angle) < -.85;
    const playRadius = isMe ? 30 : (isTopPlayer ? 17 : 24);
    const circleHeight = Math.max(1, playerCircle.clientHeight);
    const otherPlayerLift = isMe ? 0 : 80 / circleHeight * 100;
    // 12時位置のプレイヤーは、ネーム・手札・プレイ位置・獲得カードをまとめて15px下げる。
    const topPlayerDrop = !isMe && isTopPlayer ? 25 / circleHeight * 100 : 0;
    return {
      angle, isMe,
      x: 50 + radius * Math.cos(angle),
      y: 50 + radius * Math.sin(angle) - otherPlayerLift + topPlayerDrop,
      playX: 50 + playRadius * Math.cos(angle),
      playY: 50 + playRadius * Math.sin(angle) - otherPlayerLift + topPlayerDrop
    };
  };
  const winnerIndex = players.findIndex(p => p.id === state.game?.pendingCapture?.winnerId);
  const winnerGeometry = winnerIndex >= 0 ? geometryFor(players[winnerIndex], winnerIndex) : null;

  players.forEach((p, idx) => {
    const { angle, isMe, x, y, playX, playY } = geometryFor(p, idx);

    const tag = document.createElement('div');
    tag.className = 'player-tag' + (p.id === state.userId ? ' me' : '');
    tag.dataset.playerId = p.id;
    tag.textContent = p.name;
    tag.style.left = `${x}%`;
    tag.style.top = `${y}%`;

    tag.onclick = () => {
      if (p.id === state.userId) return;
      if (!state.roomCode) return;
      if (state.seatedTable !== null) return;

      pendingSeatIndexToSteal = p.seatIndex;
      pendingSeatPlayerIdToSteal = p.id;
      kickMessage.textContent = `「${p.name}」を追い出して、この席に着席しますか？`;
      kickDialog.classList.remove('hidden');
    };

    const handData = state.hands[p.id];
    if (p.id !== state.userId && handData && Array.isArray(handData.cards) && handData.cards.length){
      const miniHand = document.createElement('div');
      miniHand.className = 'mini-hand';

      // キャラクターカードは獲得カード置き場で公開するため、手札の裏面には含めない。
      const hiddenCards = handData.cards.filter(card => card?.kind !== 'character');
      const count = hiddenCards.length;
      const spread = 70;
      const base = (count > 1) ? (-spread/2) : 0;

      hiddenCards.forEach((v, idx2) => {
        const card = document.createElement('div');
        card.className = 'mini-card';
        card.textContent = '';

        const angleDeg = (count > 1) ? base + (spread/(count-1))*idx2 : 0;
        card.style.transform = `translate(-50%,0) rotate(${angleDeg}deg)`;
        card.style.zIndex = String(10 + idx2);
        miniHand.appendChild(card);
      });

      tag.appendChild(miniHand);
    }

    playerCircle.appendChild(tag);

    const play = document.createElement('div');
    play.className = `play-circle${isMe ? ' mine drop-hint' : ''}`;
    play.style.left = `${playX}%`;
    play.style.top = `${playY}%`;
    const played = state.game?.trick?.[p.id];
    if (played) {
      // カード固有IDをキーにし、手番やトリック番号の更新で既存カードを再アニメーションしない。
      const playKey = `${p.id}:${played.card.id || played.order}`;
      const slot = document.createElement('div');
      slot.className = 'played-card-slot';
      if (!playedAnimationTimes.has(playKey)) playedAnimationTimes.set(playKey, Date.now());
      const playElapsed = Date.now() - playedAnimationTimes.get(playKey);
      if (playElapsed >= 350) slot.classList.add('no-arrive');
      else slot.style.animationDelay = `${-playElapsed}ms`;
      const playedEl = createCardElement(played.card);
      playedEl.classList.add('played-card');
      slot.style.setProperty('--tilt', `${played.tilt || 0}deg`);
      if (isMe) {
        slot.classList.add('self-play');
        const circleRect = playerCircle.getBoundingClientRect();
        const targetX = circleRect.left + playX * circleRect.width / 100;
        const targetY = circleRect.top + playY * circleRect.height / 100;
        slot.style.setProperty('--from-x', `${selfDropPoint ? selfDropPoint.x - targetX : 0}px`);
        slot.style.setProperty('--from-y', `${selfDropPoint ? selfDropPoint.y - targetY : 0}px`);
        selfDropPoint = null;
      } else {
        slot.style.setProperty('--from-x', `${(x-playX)*2.5}px`);
        slot.style.setProperty('--from-y', `${(y-playY)*2.5}px`);
      }
      const pending = state.game?.pendingCapture;
      if (pending && winnerGeometry && Date.now() >= pending.gatherAt) {
        const size = playerCircle.clientWidth;
        const gatherElapsed = Date.now() - pending.gatherAt;
        slot.style.setProperty('--gather-x', `${(winnerGeometry.playX-playX)*size/100}px`);
        slot.style.setProperty('--gather-y', `${(winnerGeometry.playY-playY)*size/100}px`);
        if (gatherElapsed < 700) {
          slot.classList.remove('no-arrive');
          slot.classList.add('gathering');
          slot.style.animationDelay = `${-gatherElapsed}ms`;
        } else slot.classList.add('gathered');
      }
      slot.appendChild(playedEl);
      play.appendChild(slot);
    }
    playerCircle.appendChild(play);

    const capture = document.createElement('div');
    capture.className = 'capture-circle';
    capture.dataset.playerId = p.id;
    const capturedTricks = state.game?.capturedTricks?.[p.id] || [];
    const circleSize = Math.max(1, playerCircle.clientWidth);
    const circleHeight = Math.max(1, playerCircle.clientHeight);
    // 自分の獲得カードはネームタグの寸法や移動に影響されない、盤面基準の定位置に置く。
    const captureX = isMe ? 50 - 210 / circleSize * 100 : x + (-24 - tag.offsetWidth / 2) / circleSize * 100;
    const captureY = isMe ? 92 : y + (-33 - tag.offsetHeight / 2) / circleHeight * 100;
    capture.style.left = `${captureX}%`;
    capture.style.top = `${captureY}%`;
    const oldCount = renderedCaptureCounts.get(p.id);
    // 他プレイヤーの公開キャラクターを獲得カード列の先頭に置く。
    if (!isMe) {
      const character = handData?.cards?.find(card => card?.kind === 'character');
      if (character && Date.now() >= (characterAnimationUntil.get(p.id) || 0)) {
        const characterBundle = document.createElement('div');
        characterBundle.className = 'capture-trick character-capture';
        const characterHolder = document.createElement('div');
        characterHolder.className = 'capture-card';
        characterHolder.style.setProperty('--stack-rotate', '0deg');
        characterHolder.appendChild(createCardElement(character));
        characterBundle.appendChild(characterHolder);
        capture.appendChild(characterBundle);
      }
    }
    capturedTricks.forEach((capturedTrick, trickIndex) => {
      const bundle = document.createElement('div');
      bundle.className = 'capture-trick';
      // 獲得が5つ以上なら本人分も25pxずつずらして重ねる。
      const compactCapturedTricks = capturedTricks.length >= 5;
      const bundleLeft = compactCapturedTricks
        ? (isMe ? 0 : 35) + trickIndex * 25
        : isMe ? trickIndex * 44 : (trickIndex + 1) * 35;
      bundle.style.left = `${bundleLeft}px`;
      if (!isMe) bundle.style.zIndex = String(trickIndex + 1);
      const cards = capturedTrick.cards || [];
      const yellows = cards.filter(card => card.color === 'yellow');
      const winner = cards.find(card => card.id === capturedTrick.winningCardId);
      const ordered = yellows.length
        ? [...cards.filter(card => card.color !== 'yellow'), ...yellows]
        : [...cards.filter(card => card.id !== capturedTrick.winningCardId), ...(winner ? [winner] : [])];
      ordered.forEach((cardData, cardIndex) => {
        const holder = document.createElement('div');
        holder.className = 'capture-card';
        const yellowIndex = cardData.color === 'yellow'
          ? ordered.slice(0, cardIndex).filter(card => card.color === 'yellow').length
          : 0;
        const rotation = cardData.color === 'yellow' ? -2 + yellowIndex * 5 : -2;
        holder.style.left = cardData.color === 'yellow' ? `${yellowIndex * 4}px` : '0';
        holder.style.top = cardData.color === 'yellow' ? `${yellowIndex * 14}px` : '0';
        holder.style.setProperty('--stack-rotate', `${rotation}deg`);
        holder.appendChild(createCardElement(cardData));
        const captureKey = `${p.id}:${trickIndex}`;
        if (oldCount !== undefined && trickIndex >= oldCount && !captureAnimationTimes.has(captureKey)) {
          captureAnimationTimes.set(captureKey, Date.now());
        }
        const captureStarted = captureAnimationTimes.get(captureKey);
        const captureElapsed = captureStarted ? Date.now() - captureStarted : 700;
        if (captureElapsed < 700) {
          const size = playerCircle.clientWidth;
          holder.classList.add('new-capture');
          holder.style.animationDelay = `${-captureElapsed}ms`;
          // プレイ枠と獲得枠は大きさ・基準点が異なるため、各枠の左上と列オフセットも含めて
          // 移動元を求める。これで左上席を含む全席で、回収済みカードの位置から連続して見える。
          const playedToCapturedOffsetX = (54 - 38) / 2;
          const playedToCapturedOffsetY = (81 - 56) / 2;
          holder.style.setProperty('--capture-x', `${(playX-captureX)*size/100 - bundleLeft - playedToCapturedOffsetX}px`);
          holder.style.setProperty('--capture-y', `${(playY-captureY)*size/100 - playedToCapturedOffsetY}px`);
        }
        bundle.appendChild(holder);
      });
      capture.appendChild(bundle);
    });
    renderedCaptureCounts.set(p.id, capturedTricks.length);
    playerCircle.appendChild(capture);
  });

  const active = players.find(p=>p.id===state.game?.turnPlayerId);
  if (state.game?.finished) {
    const scores = players.map(p => `${p.name} ${state.game.tricksWon?.[p.id] || 0}`).join(' / ');
    gameStatus.textContent = `ゲーム終了　獲得トリック: ${scores}`;
  } else gameStatus.textContent = '';
}

kickDialog.addEventListener('click', (e) => {
  if (e.target === kickDialog) {
    kickDialog.classList.add('hidden');
    pendingSeatIndexToSteal = null;
    pendingSeatPlayerIdToSteal = null;
  }
});
btnKickNo.addEventListener('click', (e) => {
  e.stopPropagation();
  kickDialog.classList.add('hidden');
  pendingSeatIndexToSteal = null;
  pendingSeatPlayerIdToSteal = null;
});
btnKickYes.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (pendingSeatIndexToSteal == null || !state.roomCode) {
    kickDialog.classList.add('hidden');
    return;
  }

  const seatIndex = pendingSeatIndexToSteal;
  const roomRef = ref(db, `rooms/${state.roomCode}`);
  const roomSnap = await get(roomRef);
  const roomData = roomSnap.val() || {};

  const tRef = ref(db, `rooms/${state.roomCode}/tables/${seatIndex}`);
  await set(tRef, { playerId: state.userId, playerName: state.userName || '名無し' });

  if (roomData.hostId && pendingSeatPlayerIdToSteal && roomData.hostId === pendingSeatPlayerIdToSteal) {
    await update(roomRef, { hostId: state.userId });
  }

  state.seatedTable = seatIndex;

  kickDialog.classList.add('hidden');
  pendingSeatIndexToSteal = null;
  pendingSeatPlayerIdToSteal = null;

  seatPop.classList.add('hidden');
});

async function dealInitialHands(stageNumber){
  if (!state.roomCode) return;

  const tablesSnap = await get(ref(db, `rooms/${state.roomCode}/tables`));
  const tables = tablesSnap.val() || {};
  const seatedPlayers = Object.values(tables).filter(t => t && t.playerId);
  if (!seatedPlayers.length) return;
  const hands = {};
  const deck = CARD_DECK.map(card => ({ ...card }));
  for (let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  // 指輪1はゲーム進行に必要なため残し、それ以外から1枚を表向きで除外する。
  const excludedIndex = deck.findIndex(card => !(card.color === 'yellow' && card.number === 1));
  const excludedCard = { ...deck.splice(excludedIndex, 1)[0], id: `excluded-${Date.now()}` };
  const excludedCardTilt = Math.floor(Math.random() * 5) - 1;
  const playerOrder = seatedPlayers.map(t => t.playerId);
  playerOrder.forEach(playerId => { hands[playerId] = { cards: [] }; });
  // 1枚を除外した残りは、手札枚数の差が最大1枚になるよう順番にすべて配る。
  const dealtAt = Date.now();
  deck.forEach((card, index) => {
    const playerId = playerOrder[index % playerOrder.length];
    hands[playerId].cards.push({ ...card, id: `${playerId}-${hands[playerId].cards.length}-${dealtAt}` });
  });
  const stage = STAGES.find(item => item.number === Number(stageNumber));
  const stageCharacters = (stage?.characters || [])
    .flatMap(line => line.split(/[、,]/))
    .map(name => name.trim())
    .filter(name => name && name !== 'xxx')
    .map(label => ({ name: label.replace(/\*+$/, ''), required: /\*+$/.test(label) }));
  await update(ref(db, `rooms/${state.roomCode}`), {
    hands,
    game: {
      playerOrder, turnPlayerId: null, trickNumber: 1, stageNumber, startedAt:Date.now(),
      phase: 'character-selection', availableCharacters: stageCharacters,
      characterSelections: {},
      ringCircleOn: false, excludedCard, excludedCardTilt
    }
  });
}

hostSettingsBtn.addEventListener('click', () => {
  if (!state.isHost) return;
  startPop.classList.toggle('hidden');
});
btnStartPopClose.addEventListener('click', () => {
  startPop.classList.add('hidden');
});

function openStageDialog(){
  stageGrid.replaceChildren();
  STAGES.forEach(stage => {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'stage-tab';
    tab.textContent = `#${stage.number}`;
    tab.addEventListener('click', async () => {
      if (!state.isHost) return;
      tab.disabled = true;
      await dealInitialHands(stage.number);
      stageDialog.classList.add('hidden');
    });
    stageGrid.append(tab);
  });
  stageDialog.classList.remove('hidden');
}

btnGameStart.addEventListener('click', () => {
  if (!state.isHost) return;
  startPop.classList.add('hidden');
  openStageDialog();
});
stageDialog.addEventListener('click', event => {
  if (event.target === stageDialog) stageDialog.classList.add('hidden');
});

btnResetRoom.addEventListener('click', async () => {
  if (!state.isHost || !state.roomCode) return;

  const base = `rooms/${state.roomCode}`;
  await Promise.all([
    remove(ref(db, `${base}/maxPlayers`)),
    remove(ref(db, `${base}/tables`)),
    remove(ref(db, `${base}/hands`)),
    remove(ref(db, `${base}/game`))
  ]);

  state.seatedTable = null;
  startPop.classList.add('hidden');
  await syncSeatUI();
});
</script>
